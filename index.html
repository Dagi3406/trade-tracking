/* ============================================================
   TOOLS: lot-size calculator, killzones, pre-trade gate, cool-down
   ============================================================ */
function RiskCalculator({ settings }) {
  const [balance, setBalance] = useState(String(settings.balance));
  const [risk, setRisk] = useState(String(settings.riskPct));
  const [entry, setEntry] = useState('');
  const [stop, setStop] = useState('');
  const [target, setTarget] = useState('');

  const bal = parseFloat(balance), rk = parseFloat(risk), en = parseFloat(entry), sl = parseFloat(stop), tp = parseFloat(target);
  const ready = bal > 0 && rk > 0 && isFinite(en) && isFinite(sl) && en !== sl;
  const dist = ready ? Math.abs(en - sl) : 0;
  const riskUsd = bal > 0 && rk > 0 ? (bal * rk) / 100 : 0;
  const lots = ready ? Math.floor((riskUsd / (dist * CONTRACT)) * 100) / 100 : 0;
  const realRisk = lots * dist * CONTRACT;
  const dir = ready ? (sl < en ? 'Buy' : 'Sell') : null;
  const tpOk = dir && isFinite(tp) && (dir === 'Buy' ? tp > en : tp < en);
  const rr = tpOk ? Math.abs(tp - en) / dist : null;
  const reward = tpOk ? lots * Math.abs(tp - en) * CONTRACT : null;
  const overCap = rk > settings.riskPct;

  const Tile = ({ l, v, s, tone }) => (
    <div className="rounded-xl bg-white/[.03] border border-white/[.06] px-3 py-2.5">
      <div className="text-[10px] uppercase tracking-wider text-zinc-500">{l}</div>
      <div className={`text-lg font-bold tabular-nums leading-tight ${tone || 'text-white'}`}>{v}</div>
      {s && <div className="text-[10px] text-zinc-600">{s}</div>}
    </div>
  );

  return (
    <div className="glass rounded-2xl p-5 glow fade-up">
      <h3 className="font-semibold text-white text-[15px] flex items-center gap-2">
        <Icon n="calc" size={17} className="text-gold" /> Lot-Size Calculator
      </h3>
      <p className="text-[11px] text-zinc-500 am mt-0.5 mb-4">የሎት መጠን ማስያ · XAUUSD</p>

      <div className="grid grid-cols-2 gap-3">
        <NumField label="Balance" value={balance} onChange={setBalance} suffix="USD" />
        <NumField label="Risk" value={risk} onChange={setRisk} step="0.05" suffix="%"
          hint={overCap ? `Above your ${settings.riskPct}% cap` : `Cap: ${settings.riskPct}%`} hintTone={overCap ? 'bad' : ''} />
        <NumField label="Entry price" value={entry} onChange={setEntry} placeholder="e.g. 2650.40" />
        <NumField label="Stop-loss price" value={stop} onChange={setStop} placeholder="e.g. 2646.90" />
        <div className="col-span-2">
          <NumField label="Take-profit (optional)" value={target} onChange={setTarget} placeholder="e.g. 2660.90"
            hint={dir && isFinite(tp) && !tpOk ? `Target must be ${dir === 'Buy' ? 'above' : 'below'} entry for a ${dir}` : ''} hintTone="bad" />
        </div>
      </div>

      <div className="mt-4 grid grid-cols-2 gap-2.5">
        <Tile l="Lot size" v={ready ? lots.toFixed(2) : '—'} tone="text-gold" s={ready ? `${dir} · ${dist.toFixed(2)}$ stop` : 'enter entry & stop'} />
        <Tile l="Cash at risk" v={ready ? fmtMoney(realRisk) : '—'} s={ready ? `budget ${fmtMoney(riskUsd)}` : ''} tone={overCap ? 'text-rose-400' : 'text-white'} />
        <Tile l="Reward : risk" v={rr ? rr.toFixed(2) + 'R' : '—'} tone={rr >= 2 ? 'text-emerald-400' : rr ? 'text-amber-300' : 'text-white'} s={rr ? (rr >= 2 ? 'meets 2R target' : 'below 2R target') : ''} />
        <Tile l="Potential" v={reward !== null ? fmtMoney(reward) : '—'} tone="text-emerald-400" />
      </div>

      {ready && lots < 0.01 && (
        <p className="mt-3 text-[11px] text-amber-300 flex items-start gap-1.5"><Icon n="alert" size={12} className="mt-0.5 shrink-0" />Stop is too wide for this risk — even 0.01 lot risks more than your budget. Tighten the stop or skip.</p>
      )}
      <p className="mt-3 text-[10px] text-zinc-600 leading-relaxed">Assumes 1.00 lot = 100 oz (a $1 move = $100 per lot). Brokers differ — confirm your contract size before relying on it.</p>
    </div>
  );
}

function Killzones() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 15000);
    return () => clearInterval(t);
  }, []);

  const ny = nyMinutes(now);
  const localMin = now.getHours() * 60 + now.getMinutes();
  const offset = (((localMin - ny) % 1440) + 1440) % 1440;
  const toLocal = m => (((m + offset) % 1440) + 1440) % 1440;
  const active = zoneAt(ny);
  const next = ZONES.map(z => ({ z, inMin: (((z.s - ny) % 1440) + 1440) % 1440 })).sort((a, b) => a.inMin - b.inMin)[0];
  const dur = m => (m >= 60 ? Math.floor(m / 60) + 'h ' : '') + (m % 60) + 'm';
  const tz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return 'local time'; } })();

  const segs = Array.from({ length: 96 }, (_, k) => zoneAt((((k * 15 - offset) % 1440) + 1440) % 1440));

  return (
    <div className="glass rounded-2xl p-5 glow fade-up">
      <h3 className="font-semibold text-white text-[15px] flex items-center gap-2">
        <Icon n="globe" size={17} className="text-gold" /> Session Clock
      </h3>
      <p className="text-[11px] text-zinc-500 am mt-0.5 mb-4">የገበያ ክፍለ-ጊዜ · shown in {tz}</p>

      <div className={`rounded-xl border px-3.5 py-3 mb-4 ${active ? 'border-emerald-500/30 bg-emerald-500/10' : 'border-white/[.08] bg-white/[.03]'}`}>
        {active ? (
          <>
            <div className="flex items-center gap-2 text-[13px] font-bold text-emerald-300">
              <span className="h-2 w-2 rounded-full bg-emerald-400 pulse-gold" /> {active.name} is live
            </div>
            <div className="text-[11px] text-emerald-200/70 mt-0.5">Ends in {dur(((active.e - ny) % 1440 + 1440) % 1440)} · {active.note}</div>
          </>
        ) : (
          <>
            <div className="text-[13px] font-bold text-zinc-200 flex items-center gap-2"><Icon n="clock" size={14} className="text-zinc-500" /> Outside a killzone</div>
            <div className="text-[11px] text-zinc-500 mt-0.5">Next: {next.z.name} in {dur(next.inMin)}. Patience is a position.</div>
          </>
        )}
      </div>

      <div className="relative">
        <div className="flex h-8 rounded-lg overflow-hidden border border-white/[.07]">
          {segs.map((z, i) => (
            <div key={i} className="flex-1" style={{ background: z ? z.color + '66' : 'rgba(255,255,255,.03)' }} />
          ))}
        </div>
        <div className="absolute -top-1 -bottom-1 w-0.5 bg-white rounded-full shadow-[0_0_8px_rgba(255,255,255,.7)] pointer-events-none"
          style={{ left: (localMin / 1440) * 100 + '%' }} />
        <div className="flex justify-between text-[9px] text-zinc-600 mt-1 tabular-nums">
          <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
        </div>
      </div>

      <div className="mt-4 space-y-2">
        {ZONES.map(z => (
          <div key={z.id} className={`flex items-center gap-3 rounded-xl border px-3 py-2 ${active && active.id === z.id ? 'border-white/20 bg-white/[.05]' : 'border-white/[.05] bg-white/[.02]'}`}>
            <span className="h-2.5 w-2.5 rounded-full shrink-0" style={{ background: z.color }} />
            <div className="min-w-0 flex-1">
              <div className="text-[12px] text-zinc-200 font-medium">{z.name} <span className="am text-[10px] text-zinc-600 ml-1">{z.am}</span></div>
              <div className="text-[10px] text-zinc-600 truncate">{z.note}</div>
            </div>
            <span className="text-[11px] tabular-nums text-zinc-400 shrink-0">{fmtClock(toLocal(z.s))}–{fmtClock(toLocal(z.e))}</span>
          </div>
        ))}
      </div>
      <p className="mt-3 text-[10px] text-zinc-600">Windows follow New York time and adjust automatically for daylight saving.</p>
    </div>
  );
}

const GATE_ITEMS = [
  'HTF bias identified and aligned with the trade',
  'Price is inside a killzone',
  'Clear A/B setup with a defined invalidation',
  'Stop-loss placed — risk within my cap',
  'Calm and rested: no FOMO, no revenge'
];

function PreTradeGate() {
  const [on, setOn] = useState(GATE_ITEMS.map(() => false));
  const n = on.filter(Boolean).length;
  const go = n === GATE_ITEMS.length;
  const verdict = go
    ? { t: 'GO — execute the plan', c: 'text-emerald-300 bg-emerald-500/10 border-emerald-500/30' }
    : n >= 3
      ? { t: 'ALMOST — one more confirmation', c: 'text-amber-300 bg-amber-500/10 border-amber-500/30' }
      : { t: 'WAIT — you are not ready', c: 'text-rose-300 bg-rose-500/10 border-rose-500/30' };

  return (
    <div className="glass rounded-2xl p-5 glow fade-up">
      <div className="flex items-start justify-between">
        <div>
          <h3 className="font-semibold text-white text-[15px] flex items-center gap-2"><Icon n="shield" size={17} className="text-gold" /> Pre-Trade Gate</h3>
          <p className="text-[11px] text-zinc-500 am mt-0.5 mb-4">ከግብይት በፊት ማረጋገጫ</p>
        </div>
        <button onClick={() => setOn(GATE_ITEMS.map(() => false))} aria-label="Reset gate"
          className="p-1.5 rounded-lg text-zinc-500 hover:text-gold hover:bg-gold/10 transition active:scale-90"><Icon n="reset" size={15} /></button>
      </div>
      <div className="space-y-2">
        {GATE_ITEMS.map((t, i) => (
          <button key={i} onClick={() => setOn(a => a.map((v, j) => (j === i ? !v : v)))}
            className={`w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-left border transition active:scale-[.99]
              ${on[i] ? 'bg-emerald-500/10 border-emerald-500/30' : 'bg-white/[.02] border-white/[.06] hover:border-gold/30'}`}>
            <span className={`grid place-items-center h-5 w-5 rounded-md border shrink-0 transition ${on[i] ? 'bg-emerald-500 border-emerald-400 text-black check-pop' : 'border-white/20 text-transparent'}`}>
              <Icon n="check" size={12} strokeWidth={3.5} />
            </span>
            <span className={`text-[12px] leading-snug ${on[i] ? 'text-emerald-100' : 'text-zinc-400'}`}>{t}</span>
          </button>
        ))}
      </div>
      <div className={`mt-4 rounded-xl border px-3.5 py-2.5 text-[12px] font-bold flex items-center justify-between transition ${verdict.c}`}>
        <span>{verdict.t}</span><span className="tabular-nums opacity-80">{n}/{GATE_ITEMS.length}</span>
      </div>
    </div>
  );
}

function BreakCard({ brk }) {
  const total = brk.minutes * 60;
  return (
    <div className="glass rounded-2xl p-5 glow fade-up flex flex-col items-center text-center">
      <div className="w-full text-left">
        <h3 className="font-semibold text-white text-[15px] flex items-center gap-2"><Icon n="timer" size={17} className="text-gold" /> Cool-Down Timer</h3>
        <p className="text-[11px] text-zinc-500 am mt-0.5">የእረፍት ሰዓት</p>
      </div>
      <div className="my-4">
        <ProgressRing value={brk.active ? total - brk.left : 0} max={total} size={150} stroke={11} color={brk.active ? 'gold' : 'emerald'}>
          <div>
            <div className="text-3xl font-extrabold text-white tabular-nums font-mono leading-none">{brk.active ? brk.label : pad2(brk.minutes) + ':00'}</div>
            <div className="text-[10px] text-zinc-500 mt-1">{brk.active ? 'stay away from the chart' : 'ready'}</div>
          </div>
        </ProgressRing>
      </div>
      <BreakButton brk={brk} />
      <p className="text-[11px] text-zinc-600 mt-3 leading-relaxed">Use it after two losses in a row, a rule break, or any urge to "make it back". You'll get a buzz when it ends.</p>
    </div>
  );
}

function Tools({ data, setData, showToast }) {
  const brk = useBreak(data, setData, showToast);
  return (
    <div className="space-y-4">
      <div>
        <h2 className="text-xl font-bold text-white">Trader Toolkit</h2>
        <p className="text-[12px] text-zinc-500 am">የመሣሪያ ሳጥን</p>
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 items-start">
        <RiskCalculator settings={data.settings} />
        <Killzones />
        <PreTradeGate />
        <BreakCard brk={brk} />
      </div>
    </div>
  );
}

/* ============================================================
   AUTH SCREEN
   ============================================================ */
function AuthScreen({ onAuth }) {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [confirm, setConfirm] = useState('');
  const [showPw, setShowPw] = useState(false);
  const [remember, setRemember] = useState(true);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const fieldCls = "w-full bg-black/40 border border-white/10 rounded-xl px-3.5 py-3 text-sm text-zinc-200 outline-none focus:border-gold/60 focus:ring-2 focus:ring-gold/15 transition placeholder:text-zinc-600";
  const labelCls = "block text-[11px] uppercase tracking-wider text-zinc-500 font-medium mb-1.5";

  const switchMode = (m) => {
    setMode(m);
    setError('');
    setPassword('');
    setConfirm('');
  };

  const submit = async (e) => {
    e.preventDefault();
    if (busy) return;
    setError('');

    const emailNorm = email.trim().toLowerCase();
    if (!emailNorm || !password) { setError('Please fill in all fields.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailNorm)) { setError('Please enter a valid email address.'); return; }
    if (password.length < 6) { setError('Password must be at least 6 characters.'); return; }

    const users = loadUsers();
    setBusy(true);
    try {
      if (mode === 'signup') {
        if (users[emailNorm]) { setError('An account with that email already exists.'); setBusy(false); return; }
        if (password !== confirm) { setError('Passwords do not match.'); setBusy(false); return; }
        if (!name.trim()) { setError('Please enter your name.'); setBusy(false); return; }

        const salt = genSalt();
        const hash = await hashPassword(password, salt);
        const user = {
          id: uid(),
          email: emailNorm,
          name: name.trim(),
          salt,
          hash,
          createdAt: Date.now()
        };
        users[emailNorm] = user;
        const isFirstAccount = Object.keys(users).length === 1;
        saveUsers(users);

        // Initialize this user's data. Migrate legacy anonymous data on first-ever signup.
        let initial = DEFAULT_DATA();
        if (isFirstAccount) {
          try {
            const legacyRaw = localStorage.getItem(LEGACY_KEY);
            if (legacyRaw) {
              const parsed = JSON.parse(legacyRaw);
              initial = { ...DEFAULT_DATA(), ...parsed };
              localStorage.removeItem(LEGACY_KEY);
            }
          } catch {}
        }
        saveUserData(user.id, initial);

        const session = {
          userId: user.id,
          email: user.email,
          name: user.name,
          createdAt: Date.now(),
          expiresAt: remember ? Date.now() + 30 * 24 * 3600 * 1000 : Date.now() + 24 * 3600 * 1000
        };
        saveSession(session);
        onAuth(session);
      } else {
        const user = users[emailNorm];
        if (!user) { setError('No account found with that email.'); setBusy(false); return; }
        const hash = await hashPassword(password, user.salt);
        if (hash !== user.hash) { setError('Incorrect password.'); setBusy(false); return; }

        const session = {
          userId: user.id,
          email: user.email,
          name: user.name,
          createdAt: Date.now(),
          expiresAt: remember ? Date.now() + 30 * 24 * 3600 * 1000 : Date.now() + 24 * 3600 * 1000
        };
        saveSession(session);
        onAuth(session);
      }
    } catch (err) {
      setError('Something went wrong. Please try again.');
    }
    setBusy(false);
  };

  return (
    <div className="min-h-screen grid lg:grid-cols-2">
      {/* Left branding */}
      <div className="hidden lg:flex flex-col justify-between p-10 relative overflow-hidden border-r border-white/[.06]">
        <div className="absolute -top-40 -left-40 h-[500px] w-[500px] rounded-full bg-gold/[.08] blur-3xl float-glow pointer-events-none" />
        <div className="absolute -bottom-40 -right-40 h-[500px] w-[500px] rounded-full bg-emerald-500/[.06] blur-3xl float-glow pointer-events-none" style={{ animationDelay: '-4s' }} />

        <div className="relative">
          <div className="flex items-center gap-3">
            <div className="grid place-items-center h-11 w-11 rounded-xl bg-gradient-to-br from-gold-soft to-gold-deep shadow-lg shadow-gold/20">
              <span className="text-black font-extrabold text-sm">Au</span>
            </div>
            <div>
              <div className="text-[13px] font-bold text-white">Dagi's 90-Day Gold</div>
              <div className="text-[10px] text-zinc-500 am">የወርቅ ግብይት ስነ-ስርዓት</div>
            </div>
          </div>
        </div>

        <div className="relative max-w-md">
          <h2 className="text-4xl font-bold text-white leading-tight">
            Discipline <span className="shimmer-text">beats</span><br />prediction.
          </h2>
          <p className="text-sm text-zinc-500 mt-4 leading-relaxed">
            Track 90 days of XAUUSD trading with a focus on process, not outcomes. Journal every trade, follow the rules, build an edge.
          </p>
          <div className="grid grid-cols-3 gap-3 mt-8">
            {[
              { v: '90', l: 'Days' },
              { v: '0.5%', l: 'Max Risk' },
              { v: '1%', l: 'Daily Stop' }
            ].map((s, i) => (
              <div key={i} className="glass-soft rounded-xl p-3 border border-white/[.06]">
                <div className="text-lg font-bold text-gold tabular-nums">{s.v}</div>
                <div className="text-[10px] text-zinc-500 uppercase tracking-wider">{s.l}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="relative text-[11px] text-zinc-600">
          <p>All data is stored locally in your browser.</p>
          <p className="am mt-1">ሁሉም መረጃ በአሳሽዎ ውስጥ ብቻ ይቀመጣል።</p>
        </div>
      </div>

      {/* Right form */}
      <div className="flex items-center justify-center p-5 sm:p-10 relative">
        <div className="absolute top-5 left-5 lg:hidden flex items-center gap-2.5">
          <div className="grid place-items-center h-9 w-9 rounded-xl bg-gradient-to-br from-gold-soft to-gold-deep shadow-lg shadow-gold/20">
            <span className="text-black font-extrabold text-[13px]">Au</span>
          </div>
          <div>
            <div className="text-[13px] font-bold text-white leading-tight">Dagi's 90-Day Gold</div>
            <div className="text-[10px] text-zinc-500 leading-tight">Trading Discipline Tracker</div>
          </div>
        </div>

        <div className="w-full max-w-sm mt-16 lg:mt-0 fade-up">
          <div className="mb-6">
            <h1 className="text-2xl font-bold text-white">
              {mode === 'login' ? 'Welcome back' : 'Create your account'}
            </h1>
            <p className="text-[12px] text-zinc-500 mt-1">
              {mode === 'login' ? 'Sign in to continue your 90-day challenge.' : 'Start your 90-day discipline journey today.'}
            </p>
          </div>

          <form onSubmit={submit} className="space-y-3.5">
            {mode === 'signup' && (
              <div>
                <label className={labelCls}>Name</label>
                <div className="relative">
                  <Icon n="user" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" />
                  <input type="text" value={name} onChange={e => setName(e.target.value)}
                    placeholder="Dagi" autoComplete="name"
                    className={fieldCls + ' pl-9'} />
                </div>
              </div>
            )}

            <div>
              <label className={labelCls}>Email</label>
              <div className="relative">
                <Icon n="mail" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" />
                <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                  placeholder="you@example.com" autoComplete="email" autoFocus
                  className={fieldCls + ' pl-9'} />
              </div>
            </div>

            <div>
              <label className={labelCls}>Password</label>
              <div className="relative">
                <Icon n="lock" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" />
                <input type={showPw ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)}
                  placeholder="••••••••" autoComplete={mode === 'login' ? 'current-password' : 'new-password'}
                  className={fieldCls + ' pl-9 pr-10'} />
                <button type="button" onClick={() => setShowPw(v => !v)}
                  className="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-zinc-500 hover:text-zinc-300 transition active:scale-90">
                  <Icon n={showPw ? 'eyeOff' : 'eye'} size={15} />
                </button>
              </div>
              {mode === 'signup' && (
                <p className="text-[10px] text-zinc-600 mt-1">Minimum 6 characters.</p>
              )}
            </div>

            {mode === 'signup' && (
              <div>
                <label className={labelCls}>Confirm Password</label>
                <div className="relative">
                  <Icon n="lock" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" />
                  <input type={showPw ? 'text' : 'password'} value={confirm} onChange={e => setConfirm(e.target.value)}
                    placeholder="••••••••" autoComplete="new-password"
                    className={fieldCls + ' pl-9'} />
                </div>
              </div>
            )}

            <label className="flex items-center gap-2 cursor-pointer select-none pt-1">
              <input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)}
                className="w-3.5 h-3.5 rounded border-white/20 bg-black/40 accent-gold" />
              <span className="text-[11px] text-zinc-500">Remember me for 30 days</span>
            </label>

            {error && (
              <div className="flex items-start gap-2 text-[12px] text-rose-300 bg-rose-500/10 border border-rose-500/30 rounded-xl px-3 py-2.5 pop-in">
                <Icon n="alert" size={14} className="mt-0.5 shrink-0" />
                <span>{error}</span>
              </div>
            )}

            <button type="submit" disabled={busy}
              className={`w-full flex items-center justify-center gap-2 py-3 rounded-xl text-[13px] font-bold transition active:scale-[.99]
                ${busy
                  ? 'bg-white/10 text-zinc-500 cursor-wait'
                  : 'text-black bg-gradient-to-r from-gold-soft to-gold hover:brightness-110 shadow-lg shadow-gold/25'}`}>
              {busy ? 'Please wait…' : (mode === 'login' ? 'Sign In' : 'Create Account')}
              {!busy && <Icon n={mode === 'login' ? 'arrow' : 'plus'} size={14} strokeWidth={2.5} />}
            </button>
          </form>

          <div className="text-center text-[12px] text-zinc-500 mt-5">
            {mode === 'login' ? "Don't have an account? " : "Already have an account? "}
            <button onClick={() => switchMode(mode === 'login' ? 'signup' : 'login')}
              className="font-semibold text-gold hover:text-gold-soft transition underline-offset-4 hover:underline">
              {mode === 'login' ? 'Sign up' : 'Sign in'}
            </button>
          </div>

          <p className="text-[10px] text-zinc-600 text-center mt-6 leading-relaxed">
            Local-only authentication. Your credentials never leave this browser.<br />
            <span className="am">ምስጢርዎ በአሳሽዎ ውስጥ ብቻ ይቀመጣል።</span>
          </p>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   TRACKER (main app, shown when authenticated)
   ============================================================ */
const TABS = [
  { id: 'dashboard', label: 'Dashboard', am: 'ዳሽቦርድ', icon: 'dash' },
  { id: 'journal', label: 'Journal', am: 'መዝገብ', icon: 'book' },
  { id: 'roadmap', label: 'Roadmap', am: 'ዕቅድ', icon: 'map' },
  { id: 'analytics', label: 'Analytics', am: 'ትንተና', icon: 'chart' },
  { id: 'tools', label: 'Tools', am: 'መሣሪያ', icon: 'wrench' }
];

function TrackerApp({ session, onLogout }) {
  const [data, setData] = useState(() => loadUserData(session.userId));
  const [tab, setTab] = useState('dashboard');
  const [modalOpen, setModalOpen] = useState(false);
  const [editing, setEditing] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [profileOpen, setProfileOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  useEffect(() => {
    saveUserData(session.userId, data);
  }, [data, session.userId]);

  useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [tab]);

  const showToast = (msg, type = 'success') => {
    setToast({ msg, type });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2800);
  };

  const today = todayISO();
  const settings = data.settings;
  const dayNum = clamp(daysBetween(data.startDate, today) + 1, 1, 90);
  const stats = useMemo(() => computeStats(data.entries), [data.entries]);
  const lockedToday = data.lockDate === today;
  const todayCount = useMemo(() => tradesOf(data.entries).filter(e => e.date === today).length, [data.entries, today]);
  const achievements = useMemo(() => getAchievements(data, stats, dayNum), [data, stats, dayNum]);

  const discipline = useMemo(() => {
    const tr = tradesOf(data.entries);
    const compRate = tr.length ? tr.filter(e => e.compliant).length / tr.length : null;
    const days = clamp(dayNum, 1, 30);
    let doneDays = 0;
    for (let i = 0; i < days; i++) {
      const c = data.checklist[isoAgo(i)];
      if (c && c.filter(Boolean).length === 4) doneDays++;
    }
    const checkRate = doneDays / days;
    const score = compRate === null ? checkRate * 100 : (compRate * 0.6 + checkRate * 0.4) * 100;
    return Math.round(clamp(score, 0, 100));
  }, [data, dayNum]);

  const openNew = () => {
    if (lockedToday) { showToast('Journal is locked for today', 'error'); return; }
    setEditing(null); setModalOpen(true);
  };
  const openEdit = e => { setEditing(e); setModalOpen(true); };
  const closeModal = () => { setModalOpen(false); setEditing(null); };

  const saveEntry = entry => {
    const exists = data.entries.some(e => e.id === entry.id);
    const entries = exists ? data.entries.map(e => (e.id === entry.id ? entry : e)) : [...data.entries, entry];
    const tR = tradesOf(entries).filter(e => e.date === today).reduce((s, e) => s + e.resultR, 0);
    const autoLock = !exists && tR <= -dailyStopR(settings) + 1e-9 && data.lockDate !== today;
    setData(d => ({ ...d, entries, lockDate: autoLock ? today : d.lockDate }));
    closeModal();
    if (autoLock) showToast(`Daily stop of ${settings.dailyStopPct}% reached — journal locked. Walk away.`, 'error');
    else showToast(exists ? 'Entry updated' : 'Trade logged successfully');
  };

  const deleteEntry = id => {
    if (!confirm('Delete this journal entry?')) return;
    setData(d => ({ ...d, entries: d.entries.filter(e => e.id !== id) }));
    showToast('Entry deleted', 'warn');
  };

  const emergencyStop = () => {
    if (lockedToday) return;
    if (!confirm('Engage Emergency Stop? This locks the journal for the rest of today.')) return;
    setData(d => ({ ...d, lockDate: today }));
    showToast('Emergency stop engaged — journal locked', 'error');
  };

  const unlock = () => {
    if (!confirm('Unlocking breaks today\'s stop rule. Are you sure you are calm and thinking clearly?')) return;
    setData(d => ({ ...d, lockDate: null }));
    showToast('Journal unlocked', 'warn');
  };

  const saveSettings = ({ settings: s, startDate }) => {
    setData(d => ({ ...d, settings: s, startDate }));
    setSettingsOpen(false);
    showToast('Trading rules saved');
  };

  /* Keyboard shortcuts: N = new entry, 1–5 = switch tabs */
  useEffect(() => {
    const h = ev => {
      if (ev.metaKey || ev.ctrlKey || ev.altKey || modalOpen || settingsOpen) return;
      const t = ev.target, tag = t && t.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
      if (ev.key === 'n' || ev.key === 'N') { ev.preventDefault(); openNew(); }
      else if (/^[1-5]$/.test(ev.key)) setTab(TABS[Number(ev.key) - 1].id);
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  });

  const initial = (session.name || session.email || 'U').charAt(0).toUpperCase();

  return (
    <div className="min-h-screen pb-28 md:pb-10">
      <header className="sticky top-0 z-40 border-b border-white/[.06] bg-[#09090B]/80 backdrop-blur-xl">
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
          <div className="relative grid place-items-center h-9 w-9 rounded-xl bg-gradient-to-br from-gold-soft to-gold-deep shrink-0 shadow-lg shadow-gold/20">
            <span className="text-black font-extrabold text-[13px]">Au</span>
            <span className="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full bg-emerald-400 border-2 border-[#09090B]" />
          </div>
          <div className="min-w-0 flex-1">
            <h1 className="text-[13.5px] font-bold text-white leading-tight truncate">
              Dagi's 90-Day <span className="shimmer-text">Gold</span>
            </h1>
            <p className="text-[10px] text-zinc-500 leading-tight am truncate">የወርቅ ግብይት ስነ-ስርዓት መከታተያ</p>
          </div>

          <div className="hidden sm:flex items-center gap-3">
            <div className="text-right">
              <div className="text-[9px] uppercase tracking-widest text-zinc-500">Day</div>
              <div className="text-[13px] font-bold text-gold tabular-nums leading-tight">{dayNum}/90</div>
            </div>
            <div className="h-8 w-px bg-white/10" />
            <div className="text-right">
              <div className="text-[9px] uppercase tracking-widest text-zinc-500">Total R</div>
              <div className={`text-[13px] font-bold tabular-nums leading-tight ${stats.totalR >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                {fmtR(stats.totalR)}
              </div>
            </div>
          </div>

          <button onClick={openNew} disabled={lockedToday} title="New entry (N)"
            className={`hidden md:inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-[12px] font-bold transition active:scale-95
              ${lockedToday ? 'bg-white/5 text-zinc-600 cursor-not-allowed' : 'text-black bg-gradient-to-r from-gold-soft to-gold hover:brightness-110 shadow-lg shadow-gold/25'}`}>
            <Icon n="plus" size={14} strokeWidth={3} /> New Entry
          </button>

          <button onClick={() => setSettingsOpen(true)} aria-label="Trading rules" title="Trading rules"
            className="grid place-items-center h-9 w-9 rounded-xl text-zinc-400 hover:text-gold hover:bg-gold/10 border border-white/10 transition active:scale-90">
            <Icon n="gear" size={16} />
          </button>

          {/* Profile dropdown */}
          <div className="relative">
            <button onClick={() => setProfileOpen(v => !v)} aria-label="Account menu"
              className="grid place-items-center h-9 w-9 rounded-full bg-gradient-to-br from-gold-soft to-gold-deep text-black font-bold text-[13px] shadow-lg shadow-gold/20 hover:brightness-110 transition active:scale-95 ring-2 ring-[#09090B]"
              title={session.name || session.email}>
              {initial}
            </button>
            {profileOpen && (
              <>
                <div className="fixed inset-0 z-40" onClick={() => setProfileOpen(false)} />
                <div className="absolute right-0 top-11 z-50 w-60 glass rounded-xl border border-white/10 shadow-2xl overflow-hidden slide-up">
                  <div className="px-4 py-3 border-b border-white/[.06]">
                    <div className="text-[13px] font-semibold text-white truncate">{session.name || 'Trader'}</div>
                    <div className="text-[11px] text-zinc-500 truncate">{session.email}</div>
                  </div>
                  <button onClick={() => { setProfileOpen(false); setSettingsOpen(true); }}
                    className="w-full flex items-center gap-2 px-4 py-2.5 text-[12px] font-medium text-zinc-300 hover:bg-white/5 transition">
                    <Icon n="gear" size={14} /> Trading rules
                  </button>
                  <button onClick={() => { setProfileOpen(false); onLogout(); }}
                    className="w-full flex items-center gap-2 px-4 py-2.5 text-[12px] font-medium text-zinc-300 hover:bg-white/5 transition">
                    <Icon n="logout" size={14} /> Sign Out
                  </button>
                </div>
              </>
            )}
          </div>
        </div>

        <div className="max-w-6xl mx-auto px-4 hidden md:block">
          <nav className="flex gap-1 -mb-px">
            {TABS.map((t, i) => (
              <button key={t.id} onClick={() => setTab(t.id)} title={`${t.label} (${i + 1})`}
                className={`relative flex items-center gap-2 px-4 py-2.5 text-[12.5px] font-semibold transition-colors
                  ${tab === t.id ? 'text-gold' : 'text-zinc-500 hover:text-zinc-300'}`}>
                <Icon n={t.icon} size={15} />
                {t.label}
                {tab === t.id && (
                  <span className="absolute bottom-0 left-2 right-2 h-[2px] rounded-full bg-gradient-to-r from-gold-deep via-gold to-gold-soft" />
                )}
              </button>
            ))}
          </nav>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 py-5">
        {lockedToday && tab !== 'dashboard' && (
          <div className="mb-4 rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-2.5 text-[12px] text-rose-300 flex items-center justify-between gap-3">
            <span className="flex items-center gap-2"><Icon n="lock" size={14} /> Stop rule active — journal locked today.</span>
            <button onClick={unlock} className="text-[11px] font-semibold text-rose-200 underline decoration-rose-400/50 underline-offset-2 hover:text-white">
              Unlock
            </button>
          </div>
        )}

        {tab === 'dashboard' && (
          <Dashboard
            data={data} setData={setData} stats={stats} dayNum={dayNum}
            discipline={discipline} onAdd={openNew} achievements={achievements} showToast={showToast}
            onEmergency={emergencyStop} lockedToday={lockedToday} />
        )}
        {tab === 'journal' && (
          <Journal data={data} setData={setData} settings={settings} lockedToday={lockedToday}
            onAdd={openNew} onEdit={openEdit} onDelete={deleteEntry} showToast={showToast} />
        )}
        {tab === 'roadmap' && <Roadmap data={data} setData={setData} dayNum={dayNum} />}
        {tab === 'analytics' && <Analytics data={data} setData={setData} stats={stats} showToast={showToast} />}
        {tab === 'tools' && <Tools data={data} setData={setData} showToast={showToast} />}

        <footer className="mt-10 text-center">
          <p className="text-[10px] text-zinc-600">
            Discipline over prediction. <span className="am">ተግሣጽ ከትንበያ ይበልጣል</span>
          </p>
          <p className="text-[9px] text-zinc-700 mt-1">
            Data stored locally in your browser · Export regularly
            <span className="hidden md:inline"> · Shortcuts: <kbd>N</kbd> new entry · <kbd>1</kbd>–<kbd>5</kbd> tabs</span>
          </p>
        </footer>
      </main>

      <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 border-t border-white/[.07] bg-[#0B0B0E]/92 backdrop-blur-xl pb-[env(safe-area-inset-bottom)]">
        <div className="grid grid-cols-6">
          {TABS.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={`flex flex-col items-center gap-0.5 py-2.5 transition-colors active:scale-95
                ${tab === t.id ? 'text-gold' : 'text-zinc-600'}`}>
              <span className={`grid place-items-center h-7 w-7 rounded-lg transition-all ${tab === t.id ? 'bg-gold/15' : ''}`}>
                <Icon n={t.icon} size={17} />
              </span>
              <span className="text-[9px] font-semibold">{t.label}</span>
            </button>
          ))}
          <button onClick={openNew} disabled={lockedToday}
            className={`flex flex-col items-center gap-0.5 py-2.5 active:scale-95 ${lockedToday ? 'text-zinc-700' : 'text-gold'}`}>
            <span className={`grid place-items-center h-7 w-7 rounded-lg ${lockedToday ? 'bg-white/5' : 'bg-gradient-to-br from-gold-soft to-gold text-black shadow-lg shadow-gold/25'}`}>
              <Icon n={lockedToday ? 'lock' : 'plus'} size={17} strokeWidth={2.5} />
            </span>
            <span className="text-[9px] font-semibold">Add</span>
          </button>
        </div>
      </nav>

      <EntryModal open={modalOpen} entry={editing} settings={settings} todayCount={todayCount} onClose={closeModal} onSave={saveEntry} />
      <SettingsModal open={settingsOpen} data={data} onClose={() => setSettingsOpen(false)} onSave={saveSettings} />
      <Toast toast={toast} />
    </div>
  );
}

/* ============================================================
   ROOT
   ============================================================ */
function App() {
  const [session, setSession] = useState(loadSession);

  if (!session) {
    return <AuthScreen onAuth={setSession} />;
  }

  return (
    <TrackerApp
      key={session.userId}
      session={session}
      onLogout={() => { clearSession(); setSession(null); }}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

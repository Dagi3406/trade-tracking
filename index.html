<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useMemo, useRef } = React;

/* ============================================================
   CONSTANTS
   ============================================================ */
const LEGACY_KEY = 'dagi90.tracker.v1';
const USERS_KEY  = 'dagi90.users.v1';
const SESSION_KEY = 'dagi90.session.v1';
const DATA_PREFIX = 'dagi90.data.v1.';

/* ============================================================
   BASIC HELPERS
   ============================================================ */
const pad2 = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const isoAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const daysBetween = (a, b) => {
  const A = new Date(a + 'T00:00:00'), B = new Date(b + 'T00:00:00');
  return Math.round((B - A) / 86400000);
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtR = n => (n > 0 ? '+' : '') + Number(n).toFixed(2) + 'R';
const fmtPct = n => Number(n).toFixed(0) + '%';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const addDays = (iso, n) => {
  const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
};
function dailyMap(entries) {
  const m = {};
  entries.filter(e => e.direction !== 'No Trade' && typeof e.resultR === 'number')
    .forEach(e => { m[e.date] = (m[e.date] || 0) + e.resultR; });
  return m;
}

/* ============================================================
   AUTH STORAGE
   ============================================================ */
function loadUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); }
  catch { return {}; }
}
function saveUsers(users) {
  try { localStorage.setItem(USERS_KEY, JSON.stringify(users)); } catch {}
}
function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (!s || !s.userId) return null;
    if (s.expiresAt && Date.now() > s.expiresAt) { clearSession(); return null; }
    // Ensure user still exists
    const users = loadUsers();
    const exists = Object.values(users).some(u => u.id === s.userId);
    if (!exists) { clearSession(); return null; }
    return s;
  } catch { return null; }
}
function saveSession(s) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch {}
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch {}
}
function genSalt() {
  const arr = new Uint8Array(16);
  if (typeof crypto !== 'undefined' && crypto.getRandomValues) crypto.getRandomValues(arr);
  else for (let i = 0; i < arr.length; i++) arr[i] = Math.floor(Math.random() * 256);
  return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function hashPassword(password, salt) {
  const input = salt + ':' + password;
  if (typeof crypto !== 'undefined' && crypto.subtle) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { /* fall through */ }
  }
  // Synchronous fallback for environments without crypto.subtle (e.g. some file:// browsers)
  let h1 = 0x811c9dc5, h2 = 0x811c9dc5;
  for (let i = 0; i < input.length; i++) {
    const c = input.charCodeAt(i);
    h1 ^= c; h1 = Math.imul(h1, 0x01000193) >>> 0;
    h2 = Math.imul(h2 ^ c, 0x85ebca6b) >>> 0;
  }
  return h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
}

/* ============================================================
   PER-USER DATA STORAGE
   ============================================================ */
const DEFAULT_SETTINGS = { balance: 10000, riskPct: 0.5, dailyStopPct: 1, maxTrades: 2 };

const DEFAULT_DATA = () => ({
  version: 2,
  startDate: todayISO(),
  entries: [],
  checklist: {},
  weeks: {},
  lockDate: null,
  breakUntil: null,
  settings: { ...DEFAULT_SETTINGS }
});

function normalizeEntry(e) {
  const nt = e.direction === 'No Trade';
  return {
    id: e.id || uid(),
    date: e.date,
    direction: e.direction || 'Buy',
    setup: e.setup || 'Other',
    session: e.session || (nt ? '—' : 'Other'),
    grade: e.grade || (nt ? '' : 'B'),
    riskPct: Number(e.riskPct) || 0,
    resultR: typeof e.resultR === 'number' ? e.resultR : (Number(e.resultR) || 0),
    compliant: e.compliant !== false,
    emotion: e.emotion || 'Disciplined',
    mistakes: Array.isArray(e.mistakes) ? e.mistakes : [],
    notes: e.notes || ''
  };
}

function dataKey(userId) { return DATA_PREFIX + userId; }

function loadUserData(userId) {
  try {
    const raw = localStorage.getItem(dataKey(userId));
    if (!raw) return DEFAULT_DATA();
    const parsed = JSON.parse(raw);
    return {
      ...DEFAULT_DATA(), ...parsed, version: 2,
      entries: Array.isArray(parsed.entries) ? parsed.entries.filter(e => e && typeof e.date === 'string').map(normalizeEntry) : [],
      checklist: parsed.checklist || {},
      weeks: parsed.weeks || {},
      settings: { ...DEFAULT_SETTINGS, ...(parsed.settings || {}) }
    };
  } catch { return DEFAULT_DATA(); }
}
function saveUserData(userId, data) {
  try { localStorage.setItem(dataKey(userId), JSON.stringify(data)); } catch {}
}

/* ============================================================
   STATS
   ============================================================ */
function computeStats(entries) {
  const tr = entries.filter(e => e.direction !== 'No Trade' && typeof e.resultR === 'number');
  const wins = tr.filter(e => e.resultR > 0);
  const losses = tr.filter(e => e.resultR < 0);
  const totalR = tr.reduce((s, e) => s + e.resultR, 0);
  const gp = wins.reduce((s, e) => s + e.resultR, 0);
  const gl = Math.abs(losses.reduce((s, e) => s + e.resultR, 0));
  const pf = gl > 0 ? gp / gl : (gp > 0 ? Infinity : 0);
  const winRate = tr.length ? (wins.length / tr.length) * 100 : 0;
  const avgWin = wins.length ? gp / wins.length : 0;
  const avgLoss = losses.length ? gl / losses.length : 0;
  const expectancy = tr.length ? totalR / tr.length : 0;
  const compliance = tr.length ? (tr.filter(e => e.compliant).length / tr.length) * 100 : 0;
  const sorted = sortedTrades(entries);
  let cum = 0, peak = 0, maxDD = 0, w = 0, l = 0, maxWinStreak = 0, maxLossStreak = 0;
  sorted.forEach(e => {
    cum += e.resultR; peak = Math.max(peak, cum); maxDD = Math.max(maxDD, peak - cum);
    if (e.resultR > 0) { w++; l = 0; } else if (e.resultR < 0) { l++; w = 0; } else { w = 0; l = 0; }
    maxWinStreak = Math.max(maxWinStreak, w); maxLossStreak = Math.max(maxLossStreak, l);
  });
  const bestR = sorted.length ? Math.max(...sorted.map(e => e.resultR)) : 0;
  const worstR = sorted.length ? Math.min(...sorted.map(e => e.resultR)) : 0;
  const avgRR = avgLoss > 0 ? avgWin / avgLoss : 0;
  return { count: tr.length, wins: wins.length, losses: losses.length, totalR, gp, gl, pf, winRate, avgWin, avgLoss, expectancy, compliance,
    maxDD, maxWinStreak, maxLossStreak, bestR, worstR, avgRR };
}

function equityCurve(entries) {
  const s = [...entries]
    .filter(e => e.direction !== 'No Trade' && typeof e.resultR === 'number')
    .sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  let c = 0;
  return s.map(e => (c += e.resultR));
}

function lossStreak(entries) {
  const s = [...entries]
    .filter(e => e.direction !== 'No Trade' && typeof e.resultR === 'number')
    .sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  let n = 0;
  for (let i = s.length - 1; i >= 0; i--) { if (s[i].resultR < 0) n++; else break; }
  return n;
}

/* ============================================================
   SETTINGS, SESSIONS, INSIGHTS & GAMIFICATION
   ============================================================ */
const SESSIONS = ['London', 'New York', 'Asia', 'Other'];
const GRADES = ['A+', 'A', 'B', 'C'];
const MISTAKES = ['Moved SL', 'Early exit', 'Chased entry', 'Overtraded', 'Oversized', 'No clear setup', 'Ignored HTF bias', 'Outside killzone'];
const WEEKDAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const CONTRACT = 100; // XAUUSD: 1.00 lot = 100 oz -> $1 move = $100
const weekdayOf = iso => WEEKDAYS[(new Date(iso + 'T00:00:00').getDay() + 6) % 7];
const fmtMoney = n => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtClock = m => pad2(Math.floor(m / 60) % 24) + ':' + pad2(m % 60);

const FIELD_CLS = "w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-sm text-zinc-200 outline-none focus:border-gold/60 focus:ring-2 focus:ring-gold/15 transition placeholder:text-zinc-600";
const LABEL_CLS = "block text-[11px] uppercase tracking-wider text-zinc-500 font-medium mb-1.5";

const tradesOf = entries => entries.filter(e => e.direction !== 'No Trade' && typeof e.resultR === 'number');
const sortedTrades = entries => [...tradesOf(entries)].sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
const dailyStopR = s => (s.riskPct > 0 ? s.dailyStopPct / s.riskPct : 2);

function groupR(trades, keysFn) {
  const m = {};
  trades.forEach(e => (keysFn(e) || []).filter(Boolean).forEach(k => {
    const g = m[k] || (m[k] = { key: k, count: 0, total: 0, wins: 0 });
    g.count++; g.total += e.resultR; if (e.resultR > 0) g.wins++;
  }));
  return Object.values(m).map(g => ({ ...g, avg: g.total / g.count, winRate: (g.wins / g.count) * 100 }));
}

function longestRun(flags) {
  let best = 0, cur = 0;
  flags.forEach(f => { if (f) { cur++; best = Math.max(best, cur); } else cur = 0; });
  return best;
}
function longestDayStreak(dates) {
  const u = [...new Set(dates)].sort();
  let best = 0, cur = 0, prev = null;
  u.forEach(d => { cur = prev && daysBetween(prev, d) === 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = d; });
  return best;
}
function currentDayStreak(dates) {
  const set = new Set(dates);
  let i = set.has(todayISO()) ? 0 : 1, n = 0;
  while (set.has(isoAgo(i))) { n++; i++; }
  return n;
}
const routineDays = checklist => Object.keys(checklist || {}).filter(d => (checklist[d] || []).filter(Boolean).length === 4);

function periodStats(entries, days) {
  const from = isoAgo(days - 1);
  const list = entries.filter(e => e.date >= from);
  return { from, entries: list, stats: computeStats(list), journaledDays: new Set(list.map(e => e.date)).size };
}

function getAchievements(data, stats, dayNum) {
  const s = sortedTrades(data.entries);
  const limit = data.settings.riskPct;
  const bestStreak = longestDayStreak(data.entries.map(e => e.date));
  const routine = routineDays(data.checklist).length;
  const cleanRun = longestRun(s.map(e => e.compliant));
  const riskRun = longestRun(s.map(e => Number(e.riskPct) <= limit));
  const bestWeek = Math.max(0, ...Object.values(data.weeks || {}).map(a => (a || []).filter(Boolean).length));
  const edge = stats.count >= 20 && stats.pf >= 1.5;
  const frac = (v, t) => Math.min(1, v / t);
  return [
    { id: 'first', icon: 'spark', title: 'First Blood', desc: 'Log your first journal entry', done: data.entries.length >= 1, progress: frac(data.entries.length, 1) },
    { id: 'streak7', icon: 'flame', title: 'Seven Straight', desc: 'Journal 7 days in a row', done: bestStreak >= 7, progress: frac(bestStreak, 7) },
    { id: 'routine', icon: 'circleCheck', title: 'Ritual', desc: 'Finish the daily routine 10 times', done: routine >= 10, progress: frac(routine, 10) },
    { id: 'clean10', icon: 'shield', title: 'Clean Ten', desc: '10 rule-following trades in a row', done: cleanRun >= 10, progress: frac(cleanRun, 10) },
    { id: 'risk15', icon: 'target', title: 'Risk Guardian', desc: `15 trades in a row within ${limit}% risk`, done: riskRun >= 15, progress: frac(riskRun, 15) },
    { id: 'edge', icon: 'chart', title: 'Edge Proven', desc: '20+ trades with profit factor ≥ 1.5', done: edge, progress: edge ? 1 : Math.min(0.95, stats.count / 20) },
    { id: 'week', icon: 'award', title: 'Week Won', desc: 'Complete every goal of a roadmap week', done: bestWeek >= 4, progress: frac(bestWeek, 4) },
    { id: 'day30', icon: 'cal', title: 'Month One', desc: 'Reach day 30 of the challenge', done: dayNum >= 30, progress: frac(dayNum, 30) },
    { id: 'day90', icon: 'trophy', title: 'Gold Standard', desc: 'Complete all 90 days', done: dayNum >= 90, progress: frac(dayNum, 90) }
  ];
}

function buildInsights(entries, settings) {
  const s = sortedTrades(entries), out = [];
  if (s.length < 5) {
    const n = 5 - s.length;
    return [{ tone: 'info', text: `Log ${n} more trade${n === 1 ? '' : 's'} to unlock personalised insights.` }];
  }
  const avg = a => (a.length ? a.reduce((x, e) => x + e.resultR, 0) / a.length : 0);
  const ok = s.filter(e => e.compliant), bad = s.filter(e => !e.compliant);
  if (ok.length && bad.length) {
    const a = avg(ok), b = avg(bad);
    out.push(a >= b
      ? { tone: 'good', text: `Rule-following trades average ${fmtR(a)} vs ${fmtR(b)} when you break the rules.` }
      : { tone: 'warn', text: `Your rule-breaking trades (${fmtR(b)} avg) are ahead — that is luck, not edge. Stay with the plan.` });
  }
  const emo = groupR(s, e => [e.emotion]).filter(g => g.count >= 2).sort((a, b) => a.total - b.total);
  if (emo.length && emo[0].total < 0) out.push({ tone: 'warn', text: `Trading while "${emo[0].key}" has cost you ${fmtR(emo[0].total)} over ${emo[0].count} trades.` });
  const ses = groupR(s, e => [e.session && e.session !== '—' ? e.session : null]).filter(g => g.count >= 2).sort((a, b) => b.avg - a.avg);
  if (ses.length > 1 && ses[0].avg > 0) out.push({ tone: 'good', text: `${ses[0].key} is your strongest session (${fmtR(ses[0].avg)} per trade).` });
  const set = groupR(s, e => [e.setup]).filter(g => g.count >= 2).sort((a, b) => b.avg - a.avg);
  if (set.length > 1 && set[0].avg > 0) out.push({ tone: 'good', text: `${set[0].key} is your best setup (${fmtR(set[0].avg)} per trade, ${fmtPct(set[0].winRate)} win rate).` });
  const over = s.filter(e => Number(e.riskPct) > settings.riskPct);
  if (over.length) out.push({ tone: 'warn', text: `${over.length} trade${over.length === 1 ? '' : 's'} exceeded your ${settings.riskPct}% risk cap.` });
  const mist = groupR(s, e => e.mistakes || []).sort((a, b) => b.count - a.count);
  if (mist.length) out.push({ tone: 'warn', text: `Most frequent mistake: "${mist[0].key}" (${mist[0].count}×). Make it the focus of your next review.` });
  return out.slice(0, 5);
}

/* ---- Killzones (defined in New York time so DST is handled by Intl) ---- */
const ZONES = [
  { id: 'asia', name: 'Asian Range', am: 'የኤሽያ ክልል', s: 20 * 60, e: 24 * 60, color: '#38BDF8', note: 'Range builds — mark the highs and lows' },
  { id: 'london', name: 'London Killzone', am: 'ለንደን', s: 2 * 60, e: 5 * 60, color: '#F59E0B', note: 'Asian-range sweep, London open drive' },

];
const nyFmt = (() => {
  try { return new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }); }
  catch { return null; }
})();
function nyMinutes(d = new Date()) {
  if (!nyFmt) return ((d.getUTCHours() * 60 + d.getUTCMinutes() - 240) % 1440 + 1440) % 1440;
  const p = nyFmt.formatToParts(d);
  return (Number(p.find(x => x.type === 'hour').value) % 24) * 60 + Number(p.find(x => x.type === 'minute').value);
}
const zoneAt = min => ZONES.find(z => min >= z.s && min < z.e) || null;
function guessSession() {
  const m = nyMinutes(), z = zoneAt(m);
  if (!z) return m >= 12 * 60 && m < 17 * 60 ? 'New York' : 'Other';
  return z.id === 'asia' ? 'Asia' : z.id === 'nyam' ? 'New York' : 'London';
}

function ProgressRing({ value, max = 100, size = 190, stroke = 13, color = 'gold', children }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const pct = clamp(value / max, 0, 1);
  const gid = useMemo(() => 'g' + Math.random().toString(36).slice(2, 9), []);
  const stops = {
    gold: ['#B45309', '#F59E0B', '#FDE68A'],
    emerald: ['#065F46', '#10B981', '#6EE7B7'],
    rose: ['#9F1239', '#F43F5E', '#FDA4AF']
  }[color];

  return (
    <div className="relative" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90 block">
        <defs>
          <linearGradient id={gid} x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor={stops[0]} />
            <stop offset="55%" stopColor={stops[1]} />
            <stop offset="100%" stopColor={stops[2]} />
          </linearGradient>
        </defs>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="rgba(255,255,255,.06)" strokeWidth={stroke} />
        <circle
          cx={size / 2} cy={size / 2} r={r} fill="none"
          stroke={`url(#${gid})`} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={c}
          strokeDashoffset={c * (1 - pct)}
          style={{ transition: 'stroke-dashoffset 1.3s cubic-bezier(.16,1,.3,1)', filter: 'drop-shadow(0 0 8px rgba(245,158,11,.35))' }}
        />
      </svg>
      <div className="absolute inset-0 grid place-items-center text-center">{children}</div>
    </div>
  );
}

function Toast({ toast }) {
  if (!toast) return null;
  const tone = toast.type === 'error'
    ? 'border-rose-500/40 text-rose-300'
    : toast.type === 'warn'
      ? 'border-amber-500/40 text-amber-300'
      : 'border-emerald-500/40 text-emerald-300';
  return (
    <div className="fixed left-1/2 -translate-x-1/2 bottom-24 md:bottom-8 z-[60] pointer-events-none">
      <div className={`glass rounded-xl px-4 py-2.5 text-sm font-medium shadow-2xl slide-up ${tone}`}>
        {toast.msg}
      </div>
    </div>
  );
}

function Countdown() {
  const [left, setLeft] = useState('00:00:00');
  useEffect(() => {
    const tick = () => {
      const n = new Date();
      const m = new Date(n); m.setHours(24, 0, 0, 0);
      const s = Math.max(0, Math.floor((m - n) / 1000));
      setLeft(`${pad2(Math.floor(s / 3600))}:${pad2(Math.floor((s % 3600) / 60))}:${pad2(s % 60)}`);
    };
    tick();
    const t = setInterval(tick, 1000);
    return () => clearInterval(t);
  }, []);
  return <span className="font-mono tabular-nums text-gold tracking-tight">{left}</span>;
}

function Confetti({ trigger }) {
  const [pieces, setPieces] = useState([]);
  useEffect(() => {
    if (!trigger) return;
    const colors = ['#F59E0B', '#FCD34D', '#FDE68A', '#10B981', '#34D399', '#FFFFFF'];
    const arr = Array.from({ length: 40 }, (_, i) => ({
      id: trigger + '-' + i,
      left: Math.random() * 100,
      delay: Math.random() * 0.3,
      dur: 1.2 + Math.random() * 1.0,
      color: colors[i % colors.length],
      w: 4 + Math.random() * 6,
      h: 3 + Math.random() * 5
    }));
    setPieces(arr);
    const t = setTimeout(() => setPieces([]), 2800);
    return () => clearTimeout(t);
  }, [trigger]);

  return (
    <div className="pointer-events-none absolute inset-0 overflow-hidden rounded-2xl">
      {pieces.map(p => (
        <span key={p.id}
          className="absolute top-0 rounded-[2px]"
          style={{
            left: p.left + '%', width: p.w, height: p.h, background: p.color,
            animation: `confettiFall ${p.dur}s ${p.delay}s cubic-bezier(.2,.6,.4,1) forwards`
          }}
        />
      ))}
    </div>
  );
}

function ChecklistCard({ data, setData, today, onAllDone }) {
  const list = data.checklist[today] || [false, false, false, false];
  const done = list.filter(Boolean).length;
  const [burst, setBurst] = useState(0);
  const allDone = done === 4;

  const toggle = i => {
    const next = list.slice();
    next[i] = !next[i];
    setData(d => ({ ...d, checklist: { ...d.checklist, [today]: next } }));
    if (next.every(Boolean)) { setBurst(b => b + 1); onAllDone && onAllDone(); }
  };

  const reset = () => setData(d => ({ ...d, checklist: { ...d.checklist, [today]: [false, false, false, false] } }));

  return (
    <div className="glass rounded-2xl p-5 relative overflow-hidden glow fade-up">
      <Confetti trigger={burst} />
      <div className="flex items-start justify-between gap-3 mb-4 relative z-10">
        <div>
          <h3 className="font-semibold text-white text-[15px] flex items-center gap-2">
            <Icon n="circleCheck" size={17} className="text-gold" />
            Daily Routine
          </h3>
          <p className="text-xs text-zinc-500 mt-0.5 am">የዕለት ተዕለት ስርዓት</p>
        </div>
        <div className="flex items-center gap-2">
          <span className="text-[11px] text-zinc-500 flex items-center gap-1">
            <Icon n="clock" size={12} /> <Countdown />
          </span>
          <button onClick={reset}
            className="p-1.5 rounded-lg text-zinc-500 hover:text-gold hover:bg-gold/10 transition active:scale-90"
            title="Reset checklist">
            <Icon n="reset" size={15} />
          </button>
        </div>
      </div>

      <div className="h-1.5 w-full rounded-full bg-white/5 overflow-hidden mb-4 relative z-10">
        <div className="h-full rounded-full transition-all duration-700"
          style={{
            width: (done / 4 * 100) + '%',
            background: allDone
              ? 'linear-gradient(90deg,#10B981,#6EE7B7)'
              : 'linear-gradient(90deg,#B45309,#F59E0B,#FCD34D)'
          }} />
      </div>

      <div className="space-y-2 relative z-10">
        {CHECKLIST_ITEMS.map((item, i) => {
          const checked = list[i];
          return (
            <button key={i} onClick={() => toggle(i)}
              className={`w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-left transition-all duration-300 active:scale-[.99] border
                ${checked
                  ? 'bg-emerald-500/10 border-emerald-500/30'
                  : 'bg-white/[.02] border-white/[.06] hover:border-gold/30 hover:bg-white/[.04]'}`}>
              <span className={`grid place-items-center h-6 w-6 rounded-lg border transition-all duration-300 shrink-0
                ${checked ? 'bg-emerald-500 border-emerald-400 text-black check-pop' : 'border-white/20 text-transparent'}`}>
                <Icon n="check" size={14} strokeWidth={3} />
              </span>
              <span className="min-w-0">
                <span className={`block text-[13px] leading-tight ${checked ? 'text-emerald-200 line-through decoration-emerald-500/50' : 'text-zinc-300'}`}>
                  {item.en}
                </span>
                <span className="block text-[10px] text-zinc-600 am mt-0.5">{item.am}</span>
              </span>
            </button>
          );
        })}
      </div>

      {allDone && (
        <div className="mt-4 flex items-center gap-2 text-[12px] text-emerald-300 bg-emerald-500/10 border border-emerald-500/25 rounded-xl px-3 py-2 relative z-10 pop-in">
          <Icon n="spark" size={14} />
          <span>Routine complete — you're operating like a professional. <span className="am text-emerald-400/70">ጥሩ ሥራ!</span></span>
        </div>
      )}
    </div>
  );
}

function EquityChart({ values, height = 150, interactive = false }) {
  const W = 100, H = 100, pad = 4;
  const gid = useMemo(() => 'eq' + Math.random().toString(36).slice(2, 8), []);
  const [hover, setHover] = useState(null);
  const wrapRef = useRef(null);

  if (values.length === 0) {
    return (
      <div className="flex flex-col items-center justify-center text-center" style={{ height }}>
        <Icon n="activity" size={26} className="text-zinc-700 mb-2" />
        <p className="text-xs text-zinc-600">No trades yet — your equity curve will appear here.</p>
      </div>
    );
  }
  const all = [0, ...values];
  const min = Math.min(...all), max = Math.max(...all);
  const range = (max - min) || 1;
  const x = i => all.length === 1 ? W / 2 : pad + (i / (all.length - 1)) * (W - pad * 2);
  const y = v => pad + (1 - (v - min) / range) * (H - pad * 2);

  const pts = all.map((v, i) => `${x(i)},${y(v)}`);
  const line = 'M' + pts.join(' L');
  const area = `${line} L${x(all.length - 1)},${H - pad} L${x(0)},${H - pad} Z`;
  const positive = values[values.length - 1] >= 0;
  const col = positive ? '#10B981' : '#F43F5E';

  const onMove = ev => {
    if (!interactive || !wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    const cx = ev.touches && ev.touches[0] ? ev.touches[0].clientX : ev.clientX;
    const xp = clamp((cx - rect.left) / rect.width, 0, 1) * W;
    const i = all.length === 1 ? 0 : Math.round(clamp((xp - pad) / (W - pad * 2), 0, 1) * (all.length - 1));
    setHover(i);
  };

  return (
    <div ref={wrapRef} className="relative" style={{ height, touchAction: interactive ? 'pan-y' : 'auto' }}
      onMouseMove={onMove} onTouchMove={onMove} onMouseLeave={() => setHover(null)} onTouchEnd={() => setHover(null)}>
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{ height: '100%', width: '100%' }} className="overflow-visible block">
        <defs>
          <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={col} stopOpacity="0.35" />
            <stop offset="100%" stopColor={col} stopOpacity="0" />
          </linearGradient>
        </defs>
        {min < 0 && max > 0 && (
          <line x1={pad} x2={W - pad} y1={y(0)} y2={y(0)} stroke="rgba(255,255,255,.12)" strokeWidth="1" strokeDasharray="2 3" vectorEffect="non-scaling-stroke" />
        )}
        <path d={area} fill={`url(#${gid})`} />
        <path d={line} fill="none" stroke={col} strokeWidth="2"
          strokeLinejoin="round" strokeLinecap="round" vectorEffect="non-scaling-stroke"
          style={{ filter: `drop-shadow(0 0 5px ${positive ? 'rgba(16,185,129,.55)' : 'rgba(244,63,94,.55)'})` }} />
      </svg>
      {interactive && hover !== null && (
        <>
          <div className="absolute top-0 bottom-0 w-px bg-white/15 pointer-events-none" style={{ left: x(hover) + '%' }} />
          <div className="absolute h-3 w-3 rounded-full -translate-x-1/2 -translate-y-1/2 border-2 border-[#09090B] pointer-events-none"
            style={{ left: x(hover) + '%', top: y(all[hover]) + '%', background: col }} />
          <div className="absolute top-0 -translate-x-1/2 pointer-events-none glass rounded-lg px-2 py-1 text-[11px] font-semibold tabular-nums whitespace-nowrap"
            style={{ left: clamp(x(hover), 12, 88) + '%' }}>
            <span className="text-zinc-500">{hover === 0 ? 'Start' : 'Trade ' + hover}</span>{' '}
            <span className={all[hover] >= 0 ? 'text-emerald-400' : 'text-rose-400'}>{fmtR(all[hover])}</span>
          </div>
        </>
      )}
    </div>
  );
}

/* ---- Cool-down timer (shared by the loss-streak banner and the Tools tab) ---- */
function useBreak(data, setData, showToast, minutes = 30) {
  const [now, setNow] = useState(Date.now());
  const until = data.breakUntil;
  const active = !!until && until > now;

  useEffect(() => {
    if (!until) return;
    setNow(Date.now());
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, [until]);

  useEffect(() => {
    if (until && until <= now) {
      setData(d => ({ ...d, breakUntil: null }));
      if (now - until < 5000) {
        showToast && showToast('Break over — re-check your HTF bias before any entry.');
        try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}
      }
    }
  }, [until, now]);

  const left = active ? Math.max(0, Math.ceil((until - now) / 1000)) : 0;
  const start = () => { setNow(Date.now()); setData(d => ({ ...d, breakUntil: Date.now() + minutes * 60000 })); };
  const cancel = () => setData(d => ({ ...d, breakUntil: null }));
  return { active, left, start, cancel, minutes, label: pad2(Math.floor(left / 60)) + ':' + pad2(left % 60) };
}

/* ---- 90-day consistency heatmap ---- */
function Heatmap({ data }) {
  const today = todayISO();
  const dm = useMemo(() => dailyMap(data.entries), [data.entries]);
  const noTrade = useMemo(() => new Set(data.entries.filter(e => e.direction === 'No Trade').map(e => e.date)), [data.entries]);
  const days = useMemo(() => Array.from({ length: 90 }, (_, i) => addDays(data.startDate, i)), [data.startDate]);

  const styleOf = d => {
    if (d > today) return { background: 'transparent', border: '1px dashed rgba(255,255,255,.08)' };
    const r = dm[d];
    if (r === undefined) return { background: noTrade.has(d) ? 'rgba(56,189,248,.38)' : 'rgba(255,255,255,.05)' };
    if (r === 0) return { background: 'rgba(161,161,170,.45)' };
    const a = clamp(0.3 + (Math.abs(r) / 3) * 0.7, 0.3, 1);
    return { background: r > 0 ? `rgba(16,185,129,${a})` : `rgba(244,63,94,${a})` };
  };
  const titleOf = (d, i) => {
    const r = dm[d];
    const what = r !== undefined ? fmtR(r) : noTrade.has(d) ? 'No trade (patience)' : d > today ? 'Upcoming' : 'No entry';
    return `Day ${i + 1} · ${d} · ${what}`;
  };

  return (
    <div>
      <div className="grid gap-1 sm:gap-1.5"
        style={{ gridTemplateRows: 'repeat(7, minmax(0, 1fr))', gridAutoFlow: 'column', gridAutoColumns: 'minmax(0, 1fr)' }}>
        {days.map((d, i) => (
          <div key={d} title={titleOf(d, i)} aria-label={titleOf(d, i)}
            className={`hm-cell h-4 sm:h-6 rounded-[5px] ${d === today ? 'ring-1 ring-gold' : ''}`}
            style={styleOf(d)} />
        ))}
      </div>
      <div className="flex flex-wrap items-center justify-between gap-2 mt-3 text-[10px] text-zinc-600">
        <span>Each column = 1 challenge week</span>
        <span className="flex items-center gap-2.5 flex-wrap">
          <span className="flex items-center gap-1"><i className="h-2.5 w-2.5 rounded-[3px] inline-block" style={{ background: 'rgba(244,63,94,.8)' }} />Loss</span>
          <span className="flex items-center gap-1"><i className="h-2.5 w-2.5 rounded-[3px] inline-block" style={{ background: 'rgba(16,185,129,.8)' }} />Win</span>
          <span className="flex items-center gap-1"><i className="h-2.5 w-2.5 rounded-[3px] inline-block" style={{ background: 'rgba(56,189,248,.38)' }} />No trade</span>
          <span className="flex items-center gap-1"><i className="h-2.5 w-2.5 rounded-[3px] inline-block" style={{ background: 'rgba(255,255,255,.05)' }} />Empty</span>
        </span>
      </div>
    </div>
  );
}

              <button onClick={onAdd}
                className="inline-flex items-center gap-1.5 text-[12px] font-semibold text-black bg-gradient-to-r from-gold-soft to-gold px-3.5 py-2 rounded-lg hover:brightness-110 transition active:scale-95">
                <Icon n="plus" size={14} strokeWidth={2.5} /> Log First Trade
              </button>
            </div>
          ) : (
            <div className="space-y-2">
              {recent.map((e, i) => (
                <div key={e.id} className="flex items-center gap-3 rounded-xl bg-white/[.025] border border-white/[.05] px-3 py-2.5 fade-up"
                  style={{ animationDelay: i * 60 + 'ms' }}>
                  <span className={`grid place-items-center h-8 w-8 rounded-lg shrink-0 text-[10px] font-bold
                    ${e.direction === 'Buy' ? 'bg-emerald-500/15 text-emerald-400'

                    {e.direction === 'Buy' ? 'B' : e.direction === 'Sell' ? 'S' : '—'}

                  <div className="min-w-0 flex-1">
                    <div className="text-[13px] text-zinc-200 truncate">{e.setup}</div>
                    <div className="text-[10px] text-zinc-600">{e.date} · {e.emotion}{e.direction !== 'No Trade' && e.session ? ' · ' + e.session : ''}</div>

                  <span className={`text-[13px] font-bold tabular-nums ${e.resultR > 0 ? 'text-emerald-400' : e.resultR < 0 ? 'text-rose-400' : 'text-zinc-500'}`}>

        <div className="glass rounded-2xl p-5 fade-up border border-rose-500/20">

            <Icon n="brain" size={17} className="text-rose-400" /> Psychology Guard

          <p className="text-[11px] text-zinc-500 mb-4">Protect your capital when emotions take over.</p>

          <div className="space-y-2 mb-4">
            <div className="flex items-center justify-between text-[11px] bg-white/[.03] rounded-lg px-3 py-2">

            </div>
            <div className="flex items-center justify-between text-[11px] bg-white/[.03] rounded-lg px-3 py-2">
              <span className="text-zinc-500">Today's P/L</span>
              <span className={`tabular-nums font-semibold ${todayR >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>{fmtR(todayR)}</span>
            </div>
            <div className="flex items-center justify-between text-[11px] bg-white/[.03] rounded-lg px-3 py-2">
              <span className="text-zinc-500">Journal status</span>
              <span className={`font-semibold ${lockedToday ? 'text-rose-400' : 'text-emerald-400'}`}>{lockedToday ? 'LOCKED' : 'OPEN'}</span>

            disabled={lockedToday}
            className={`w-full flex items-center justify-center gap-2 rounded-xl py-2.5 text-[12px] font-bold transition active:scale-95

                ? 'bg-white/5 text-zinc-600 cursor-not-allowed border border-white/5'

/* ============================================================
   JOURNAL
   ============================================================ */
const SETUPS = ['ICT FVG', 'Liquidity Sweep', 'BOS / CHoCH', 'Order Block', 'Other'];
const EMOTIONS = ['Disciplined', 'Patient', 'FOMO', 'Greedy', 'Revenge', 'Anxious'];

function EntryModal(props) {
  return props.open ? <EntryForm {...props} /> : null;
}

function EntryForm({ entry, settings, todayCount, onClose, onSave }) {
  const editing = !!entry;
  const [f, setF] = useState(() => entry ? {
    ...entry,
    resultR: entry.direction === 'No Trade' ? '' : String(entry.resultR),
    riskPct: String(entry.riskPct),
    session: entry.session || 'Other',
    grade: entry.grade || 'B',
    mistakes: entry.mistakes || []
  } : {
    date: todayISO(), direction: 'Buy', setup: 'ICT FVG', session: guessSession(), grade: 'A',
    riskPct: String(settings.riskPct), resultR: '', compliant: true, emotion: 'Disciplined', mistakes: [], notes: ''
  });

  useEffect(() => {
    const h = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);

  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const toggleMistake = m => setF(p => ({ ...p, mistakes: p.mistakes.includes(m) ? p.mistakes.filter(x => x !== m) : [...p.mistakes, m] }));
  const isNoTrade = f.direction === 'No Trade';
  const overRisk = !isNoTrade && Number(f.riskPct) > settings.riskPct;
  const overLimit = !editing && !isNoTrade && todayCount >= settings.maxTrades;
  const compliant = !overRisk && !!f.compliant;
  const valid = f.date && (isNoTrade || (f.resultR !== '' && !isNaN(Number(f.resultR))));

  const submit = () => {
    if (!valid) return;
    onSave({
      id: editing ? entry.id : uid(),
      date: f.date,
      direction: f.direction,
      setup: isNoTrade ? 'No Trade' : f.setup,
      session: isNoTrade ? '—' : f.session,
      grade: isNoTrade ? '' : f.grade,
      riskPct: isNoTrade ? 0 : Number(f.riskPct) || 0,
      resultR: isNoTrade ? 0 : Number(f.resultR),
      compliant: isNoTrade ? true : compliant,
      emotion: f.emotion,
      mistakes: isNoTrade ? [] : f.mistakes,
      notes: f.notes.trim()
    });
  };

  const chip = (on, tone = 'gold') => `px-3 py-1.5 rounded-full text-[11px] font-medium border transition active:scale-95 ${on
    ? tone === 'rose' ? 'bg-rose-500/20 border-rose-500/50 text-rose-300' : 'bg-gold/20 border-gold/50 text-gold-soft'
    : 'bg-white/[.03] border-white/[.08] text-zinc-500 hover:border-white/20'}`;

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" role="dialog" aria-modal="true">
      <div className="absolute inset-0 bg-black/75 backdrop-blur-sm" onClick={onClose} />
      <div className="relative w-full sm:max-w-lg max-h-[92vh] overflow-y-auto glass rounded-t-3xl sm:rounded-2xl border border-white/10 slide-up">
        <div className="sticky top-0 z-10 flex items-center justify-between px-5 py-4 border-b border-white/[.07] bg-[#101013]/95 backdrop-blur-xl">
          <div>
            <h3 className="font-semibold text-white text-[15px] flex items-center gap-2">
              <Icon n={editing ? 'pencil' : 'book'} size={16} className="text-gold" /> {editing ? 'Edit Journal Entry' : 'New Journal Entry'}
            </h3>
            <p className="text-[10px] text-zinc-500 am">{editing ? 'መዝገብ ማስተካከያ' : 'አዲስ የግብይት መዝገብ'}</p>
          </div>
          <button onClick={onClose} aria-label="Close" className="p-2 rounded-lg text-zinc-500 hover:text-white hover:bg-white/10 transition active:scale-90">
            <Icon n="x" size={17} />
          </button>
        </div>

        <div className="p-5 space-y-4">
          {overLimit && (
            <div className="flex items-start gap-2 text-[12px] text-amber-300 bg-amber-500/10 border border-amber-500/30 rounded-xl px-3 py-2.5">
              <Icon n="alert" size={14} className="mt-0.5 shrink-0" />
              <span>You've already taken {todayCount} of {settings.maxTrades} planned trades today. Another one is overtrading — be honest in the tags below.</span>
            </div>
          )}

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className={LABEL_CLS}>Date</label>
              <input type="date" value={f.date} onChange={e => set('date', e.target.value)} className={FIELD_CLS} />
            </div>
            <div>
              <label className={LABEL_CLS}>Planned Risk %</label>
              <input type="number" step="0.05" min="0" value={f.riskPct}
                onChange={e => set('riskPct', e.target.value)} className={FIELD_CLS} disabled={isNoTrade} />
              <p className={`text-[10px] mt-1 ${overRisk ? 'text-rose-400' : 'text-zinc-600'}`}>
                {overRisk ? `⚠ Exceeds ${settings.riskPct}% rule — logged as a rule break` : `Max allowed: ${settings.riskPct}%`}
              </p>
            </div>
          </div>

          <div>
            <label className={LABEL_CLS}>Direction</label>
            <div className="grid grid-cols-3 gap-2">
              {['Buy', 'Sell', 'No Trade'].map(d => (
                <button key={d} onClick={() => set('direction', d)}
                  className={`py-2.5 rounded-xl text-[12px] font-semibold border transition active:scale-95
                    ${f.direction === d
                      ? d === 'Buy' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300'
                        : d === 'Sell' ? 'bg-rose-500/20 border-rose-500/50 text-rose-300'
                          : 'bg-white/10 border-white/25 text-zinc-200'
                      : 'bg-white/[.03] border-white/[.08] text-zinc-500 hover:border-white/20'}`}>
                  {d}
                </button>
              ))}
            </div>
            {isNoTrade && <p className="text-[11px] text-sky-300/80 mt-2">Sitting out is a position. Log why — patience is part of the edge.</p>}
          </div>

          {!isNoTrade && (
            <>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className={LABEL_CLS}>Setup</label>
                  <select value={f.setup} onChange={e => set('setup', e.target.value)} className={FIELD_CLS}>
                    {SETUPS.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
                <div>
                  <label className={LABEL_CLS}>Result (R)</label>
                  <input type="number" step="0.1" inputMode="decimal" placeholder="e.g. 2 or -1.5" value={f.resultR}
                    onChange={e => set('resultR', e.target.value)} className={FIELD_CLS} autoFocus={!editing} />
                  {f.resultR !== '' && !isNaN(Number(f.resultR)) && (
                    <p className={`text-[10px] mt-1 tabular-nums ${Number(f.resultR) >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                      ≈ {fmtMoney(Number(f.resultR) * settings.balance * settings.riskPct / 100)} on {fmtMoney(settings.balance).replace('.00', '')}
                    </p>
                  )}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className={LABEL_CLS}>Session</label>
                  <select value={f.session} onChange={e => set('session', e.target.value)} className={FIELD_CLS}>
                    {SESSIONS.map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
                <div>
                  <label className={LABEL_CLS}>Setup Grade</label>
                  <div className="grid grid-cols-4 gap-1.5">
                    {GRADES.map(g => (
                      <button key={g} onClick={() => set('grade', g)}
                        className={`py-2.5 rounded-xl text-[12px] font-bold border transition active:scale-95
                          ${f.grade === g ? 'bg-gold/20 border-gold/50 text-gold-soft' : 'bg-white/[.03] border-white/[.08] text-zinc-500 hover:border-white/20'}`}>
                        {g}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <div>
                <label className={LABEL_CLS}>Rule Compliance</label>
                <div className="grid grid-cols-2 gap-2">
                  <button onClick={() => set('compliant', true)} disabled={overRisk}
                    className={`py-2.5 rounded-xl text-[12px] font-semibold border transition active:scale-95 flex items-center justify-center gap-1.5
                      ${compliant ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' : 'bg-white/[.03] border-white/[.08] text-zinc-500'} ${overRisk ? 'opacity-40 cursor-not-allowed' : ''}`}>
                    <Icon n="check" size={13} strokeWidth={3} /> Followed Rules
                  </button>
                  <button onClick={() => set('compliant', false)}
                    className={`py-2.5 rounded-xl text-[12px] font-semibold border transition active:scale-95 flex items-center justify-center gap-1.5
                      ${!compliant ? 'bg-rose-500/20 border-rose-500/50 text-rose-300' : 'bg-white/[.03] border-white/[.08] text-zinc-500'}`}>
                    <Icon n="x" size={13} strokeWidth={3} /> Broke Rules
                  </button>
                </div>
              </div>

              <div>
                <label className={LABEL_CLS}>Mistakes <span className="normal-case tracking-normal text-zinc-600">(optional)</span></label>
                <div className="flex flex-wrap gap-2">
                  {MISTAKES.map(m => (
                    <button key={m} onClick={() => toggleMistake(m)} className={chip(f.mistakes.includes(m), 'rose')}>{m}</button>
                  ))}
                </div>
              </div>
            </>
          )}

          <div>
            <label className={LABEL_CLS}>Emotion Tag</label>
            <div className="flex flex-wrap gap-2">
              {EMOTIONS.map(em => (
                <button key={em} onClick={() => set('emotion', em)} className={chip(f.emotion === em)}>{em}</button>
              ))}
            </div>
          </div>

          <div>
            <label className={LABEL_CLS}>Notes</label>
            <textarea rows="3" value={f.notes} onChange={e => set('notes', e.target.value)}
              placeholder="What did you see? What did you feel? What would you do differently?"
              className={FIELD_CLS + ' resize-none'} />
          </div>

          <div className="flex gap-2 pt-1 pb-2">
            <button onClick={onClose}
              className="flex-1 py-3 rounded-xl text-[13px] font-semibold text-zinc-400 bg-white/5 border border-white/10 hover:bg-white/10 transition active:scale-95">
              Cancel
            </button>
            <button onClick={submit} disabled={!valid}
              className={`flex-1 py-3 rounded-xl text-[13px] font-bold transition active:scale-95
                ${valid
                  ? 'text-black bg-gradient-to-r from-gold-soft to-gold hover:brightness-110 shadow-lg shadow-gold/20'
                  : 'bg-white/5 text-zinc-600 cursor-not-allowed'}`}>
              {editing ? 'Update Entry' : 'Save Entry'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function SettingsModal(props) {
  return props.open ? <SettingsForm {...props} /> : null;
}

function SettingsForm({ data, onClose, onSave }) {
  const s0 = data.settings;
  const [f, setF] = useState(() => ({ balance: String(s0.balance), riskPct: String(s0.riskPct), dailyStopPct: String(s0.dailyStopPct), maxTrades: String(s0.maxTrades), startDate: data.startDate }));
  const [err, setErr] = useState('');

  useEffect(() => {
    const h = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);

  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const risk = parseFloat(f.riskPct), stop = parseFloat(f.dailyStopPct);
  const stopR = risk > 0 && stop > 0 ? stop / risk : null;

  const submit = () => {
    const balance = parseFloat(f.balance), maxTrades = parseInt(f.maxTrades, 10);
    if (!(balance > 0)) return setErr('Account balance must be greater than 0.');
    if (!(risk > 0 && risk <= 5)) return setErr('Risk per trade must be between 0.05% and 5%.');
    if (!(stop >= risk && stop <= 20)) return setErr('Daily stop must be at least one trade\'s risk (and at most 20%).');
    if (!(maxTrades >= 1 && maxTrades <= 50)) return setErr('Max trades per day must be between 1 and 50.');
    if (!f.startDate) return setErr('Pick a start date.');
    onSave({ settings: { balance, riskPct: risk, dailyStopPct: stop, maxTrades }, startDate: f.startDate });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" role="dialog" aria-modal="true">
      <div className="absolute inset-0 bg-black/75 backdrop-blur-sm" onClick={onClose} />
      <div className="relative w-full sm:max-w-md max-h-[92vh] overflow-y-auto glass rounded-t-3xl sm:rounded-2xl border border-white/10 slide-up">
        <div className="flex items-center justify-between px-5 py-4 border-b border-white/[.07]">
          <div>
            <h3 className="font-semibold text-white text-[15px] flex items-center gap-2"><Icon n="gear" size={16} className="text-gold" /> Trading Rules</h3>
            <p className="text-[10px] text-zinc-500 am">የግብይት ደንቦች</p>
          </div>
          <button onClick={onClose} aria-label="Close" className="p-2 rounded-lg text-zinc-500 hover:text-white hover:bg-white/10 transition active:scale-90"><Icon n="x" size={17} /></button>
        </div>
        <div className="p-5 space-y-4">
          <p className="text-[12px] text-zinc-500 leading-relaxed">These drive the risk meter, the auto-lock, the lot-size calculator and every warning in the app.</p>
          <div className="grid grid-cols-2 gap-3">
            <NumField label="Account balance" value={f.balance} onChange={v => set('balance', v)} suffix="USD" />
            <NumField label="Risk per trade" value={f.riskPct} onChange={v => set('riskPct', v)} step="0.05" suffix="%" />
            <NumField label="Daily stop" value={f.dailyStopPct} onChange={v => set('dailyStopPct', v)} step="0.1" suffix="%"
              hint={stopR ? `= ${stopR.toFixed(1)}R · journal auto-locks here` : ''} />
            <NumField label="Max trades / day" value={f.maxTrades} onChange={v => set('maxTrades', v)} step="1" />
          </div>
          <div>
            <label className={LABEL_CLS}>Challenge start date</label>
            <input type="date" value={f.startDate} onChange={e => set('startDate', e.target.value)} className={FIELD_CLS} />
            <p className="text-[10px] text-zinc-600 mt-1">Moves the Day counter, heatmap and roadmap week.</p>
          </div>
          {err && (
            <div className="flex items-start gap-2 text-[12px] text-rose-300 bg-rose-500/10 border border-rose-500/30 rounded-xl px-3 py-2.5">
              <Icon n="alert" size={14} className="mt-0.5 shrink-0" /><span>{err}</span>
            </div>
          )}
          <div className="flex gap-2 pt-1 pb-1">
            <button onClick={onClose} className="flex-1 py-3 rounded-xl text-[13px] font-semibold text-zinc-400 bg-white/5 border border-white/10 hover:bg-white/10 transition active:scale-95">Cancel</button>
            <button onClick={submit} className="flex-1 py-3 rounded-xl text-[13px] font-bold text-black bg-gradient-to-r from-gold-soft to-gold hover:brightness-110 shadow-lg shadow-gold/20 transition active:scale-95">Save Rules</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function Journal({ data, setData, settings, lockedToday, onAdd, onEdit, onDelete, showToast }) {
  const [q, setQ] = useState('');
  const [setupF, setSetupF] = useState('All');
  const [dirF, setDirF] = useState('All');
  const [ruleF, setRuleF] = useState('All');

  const filtered = useMemo(() => {
    return [...data.entries]
      .filter(e => {
        if (setupF !== 'All' && e.setup !== setupF) return false;
        if (dirF !== 'All' && e.direction !== dirF) return false;
        if (ruleF === 'Followed' && !e.compliant) return false;
        if (ruleF === 'Broke' && e.compliant) return false;
        if (q) {
          const hay = `${e.setup} ${e.notes} ${e.emotion} ${e.date} ${e.direction} ${e.session || ''} ${(e.mistakes || []).join(' ')}`.toLowerCase();
          if (!hay.includes(q.toLowerCase())) return false;
        }
        return true;
      })
      .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  }, [data.entries, q, setupF, dirF, ruleF]);

  const selCls = "bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-[12px] text-zinc-300 outline-none focus:border-gold/60 transition [&>option]:bg-[#18181B]";

  return (
    <div className="space-y-4">
      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h2 className="text-xl font-bold text-white">Trading Journal</h2>
          <p className="text-[12px] text-zinc-500 am">የግብይት መዝገብ · {data.entries.length} entries</p>
        </div>
        <button onClick={onAdd} disabled={lockedToday}
          className={`inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-[13px] font-bold transition active:scale-95
            ${lockedToday
              ? 'bg-white/5 text-zinc-600 cursor-not-allowed border border-white/5'
              : 'text-black bg-gradient-to-r from-gold-soft to-gold hover:brightness-110 shadow-lg shadow-gold/25'}`}>
          <Icon n={lockedToday ? 'lock' : 'plus'} size={15} strokeWidth={2.5} />
          {lockedToday ? 'Journal Locked' : 'New Entry'}
        </button>
      </div>

      {lockedToday && (
        <div className="rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-2.5 text-[12px] text-rose-300 flex items-center gap-2">
          <Icon n="lock" size={14} /> Emergency stop is active. Journal input is locked for today.
        </div>
      )}

      <div className="glass rounded-2xl p-3 flex flex-col sm:flex-row gap-2">
        <div className="relative flex-1">
          <Icon n="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" />
          <input value={q} onChange={e => setQ(e.target.value)}
            placeholder="Search setup, notes, emotion…"
            className="w-full bg-black/40 border border-white/10 rounded-xl pl-9 pr-3 py-2.5 text-[13px] text-zinc-200 outline-none focus:border-gold/60 transition placeholder:text-zinc-600" />
        </div>
        <div className="grid grid-cols-3 gap-2">
          <select value={setupF} onChange={e => setSetupF(e.target.value)} className={selCls}>
            <option value="All">All Setups</option>
            {SETUPS.map(s => <option key={s} value={s}>{s}</option>)}
            <option value="No Trade">No Trade</option>
          </select>
          <select value={dirF} onChange={e => setDirF(e.target.value)} className={selCls}>

        <div className="glass rounded-2xl p-12 text-center">
          <Icon n="book" size={32} className="text-zinc-700 mx-auto mb-3" />
          <p className="text-sm text-zinc-500">No entries match your filters.</p>
          <p className="text-[11px] text-zinc-600 mt-1">Try clearing the search or log a new trade.</p>
        </div>
      ) : (
        <div className="space-y-2.5">
          {filtered.map((e, i) => {
            const win = e.resultR > 0;
            const loss = e.resultR < 0;

              <div key={e.id}
                className="glass rounded-2xl p-4 glow fade-up group"
                style={{ animationDelay: Math.min(i * 45, 500) + 'ms' }}>
                <div className="flex items-start gap-3">
                  <div className={`grid place-items-center h-10 w-10 rounded-xl shrink-0 text-[11px] font-bold
                    ${e.direction === 'Buy' ? 'bg-emerald-500/15 text-emerald-400 border border-emerald-500/25'
                      : e.direction === 'Sell' ? 'bg-rose-500/15 text-rose-400 border border-rose-500/25'
                        : 'bg-white/5 text-zinc-500 border border-white/10'}`}>
                    {e.direction === 'Buy' ? 'BUY' : e.direction === 'Sell' ? 'SELL' : '—'}
                  </div>

                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="text-[13.5px] font-semibold text-zinc-100">{e.setup}</span>
                      {e.direction !== 'No Trade' && e.grade && (
                        <span className="text-[9.5px] font-bold text-gold bg-gold/10 border border-gold/25 rounded-full px-1.5 py-0.5">{e.grade}</span>
                      )}
                      {e.compliant
                        ? <span className="inline-flex items-center gap-1 text-[9.5px] font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/25 rounded-full px-1.5 py-0.5">
                            <Icon n="check" size={9} strokeWidth={3} /> RULES
                          </span>
                        : <span className="inline-flex items-center gap-1 text-[9.5px] font-semibold text-rose-400 bg-rose-500/10 border border-rose-500/25 rounded-full px-1.5 py-0.5">
                            <Icon n="x" size={9} strokeWidth={3} /> BROKE
                          </span>}
                      {Number(e.riskPct) > settings.riskPct && (
                        <span className="text-[9.5px] font-semibold text-amber-400 bg-amber-500/10 border border-amber-500/25 rounded-full px-1.5 py-0.5">
                          ⚠ &gt;{settings.riskPct}%
                        </span>
                      )}
                    </div>
                    <div className="flex items-center gap-2 text-[11px] text-zinc-500 mt-1 flex-wrap">
                      <span className="flex items-center gap-1"><Icon n="cal" size={11} />{e.date}</span>
                      <span className="text-zinc-700">·</span>
                      <span>{e.emotion}</span>
                      <span className="text-zinc-700">·</span>
                      <span>Risk {e.riskPct}%</span>
                      {e.direction !== 'No Trade' && e.session && (<><span className="text-zinc-700">·</span><span>{e.session}</span></>)}
                    </div>
                    {(e.mistakes || []).length > 0 && (
                      <div className="flex flex-wrap gap-1.5 mt-2">
                        {e.mistakes.map(m => (
                          <span key={m} className="text-[9.5px] font-medium text-rose-300 bg-rose-500/10 border border-rose-500/25 rounded-full px-1.5 py-0.5">{m}</span>
                        ))}
                      </div>
                    )}
                    {e.notes && <p className="text-[12px] text-zinc-400 mt-2 leading-relaxed break-words">{e.notes}</p>}
                  </div>

                  <div className="flex flex-col items-end gap-1.5 shrink-0">
                    <div className={`text-[15px] font-bold tabular-nums ${win ? 'text-emerald-400' : loss ? 'text-rose-400' : 'text-zinc-500'}`}>
                      {e.direction === 'No Trade' ? 'No Trade' : fmtR(e.resultR)}
                    </div>
                    <div className="flex items-center gap-0.5 opacity-0 group-hover:opacity-100 focus-within:opacity-100 [@media(hover:none)]:opacity-100 transition">
                      <button onClick={() => onEdit(e)} aria-label="Edit entry"
                        className="p-1.5 rounded-lg text-zinc-600 hover:text-gold hover:bg-gold/10 transition active:scale-90">
                        <Icon n="pencil" size={13} />
                      </button>
                      <button onClick={() => onDelete(e.id)} aria-label="Delete entry"
                        className="p-1.5 rounded-lg text-zinc-600 hover:text-rose-400 hover:bg-rose-500/10 transition active:scale-90">
                        <Icon n="trash" size={13} />
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

const PHASE_META = {
  1: { name: 'Phase 1 · Foundation', sub: 'Weeks 1–4', color: 'gold', desc: 'Rules, risk model, and market-structure mastery.' },
  2: { name: 'Phase 2 · Demo & Backtest', sub: 'Weeks 5–9', color: 'sky', desc: 'Prove the edge in simulation before risking capital.' },
  3: { name: 'Phase 3 · Evaluation', sub: 'Weeks 10–13', color: 'emerald', desc: 'Execute with discipline under real constraints.' }
};

function Roadmap({ data, setData, dayNum }) {
  const currentWeek = clamp(Math.ceil(dayNum / 7), 1, 13);
  const [openWeek, setOpenWeek] = useState(currentWeek);

  const toggleGoal = (week, idx) => {
    setData(d => {
      const cur = d.weeks[week] || [];
      const next = [...cur];
      next[idx] = !next[idx];
      return { ...d, weeks: { ...d.weeks, [week]: next } };
    });
  };

  const weekProgress = w => {
    const arr = data.weeks[w.week] || [];
    const done = w.goals.filter((_, i) => arr[i]).length;
    return { done, total: w.goals.length, pct: (done / w.goals.length) * 100 };
  };

  const totalGoals = ROADMAP.reduce((s, w) => s + w.goals.length, 0);
  const totalDone = ROADMAP.reduce((s, w) => {
    const arr = data.weeks[w.week] || [];
    return s + w.goals.filter((_, i) => arr[i]).length;
  }, 0);

  return (
    <div className="space-y-4">
      <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-3">
        <div>
          <h2 className="text-xl font-bold text-white">13-Week Roadmap</h2>
          <p className="text-[12px] text-zinc-500 am">የ13 ሳምንት ዕቅድ</p>
        </div>
        <div className="glass-soft rounded-xl px-4 py-2.5 border border-white/[.06]">
          <div className="flex items-center gap-3">
            <div className="text-right">
              <div className="text-[10px] uppercase tracking-wider text-zinc-500">Overall</div>
              <div className="text-sm font-bold text-white tabular-nums">{totalDone}/{totalGoals}</div>
            </div>
            <div className="h-8 w-px bg-white/10" />
            <div className="text-right">
              <div className="text-[10px] uppercase tracking-wider text-zinc-500">Week</div>
              <div className="text-sm font-bold text-gold tabular-nums">{currentWeek} / 13</div>
            </div>
          </div>
        </div>
      </div>

      <div className="h-1.5 w-full rounded-full bg-white/5 overflow-hidden" aria-label="Overall roadmap progress">
        <div className="h-full rounded-full transition-all duration-700"
          style={{ width: (totalDone / totalGoals * 100) + '%', background: 'linear-gradient(90deg,#B45309,#F59E0B,#FCD34D)' }} />
      </div>

      {[1, 2, 3].map(phase => {
        const meta = PHASE_META[phase];
        const weeks = ROADMAP.filter(w => w.phase === phase);
        const colorMap = {
          gold: 'text-gold border-gold/30 bg-gold/10',
          sky: 'text-sky-400 border-sky-500/30 bg-sky-500/10',
          emerald: 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10'
        };
        const barMap = {
          gold: 'linear-gradient(90deg,#B45309,#F59E0B,#FCD34D)',
          sky: 'linear-gradient(90deg,#0369A1,#0EA5E9,#7DD3FC)',
          emerald: 'linear-gradient(90deg,#065F46,#10B981,#6EE7B7)'
        };
        return (
          <div key={phase} className="relative pl-5 sm:pl-7 fade-up" style={{ animationDelay: (phase * 90) + 'ms' }}>
            <div className="absolute left-0 top-2 bottom-2 w-px bg-gradient-to-b from-white/20 via-white/10 to-transparent" />
            <div className={`absolute left-[-5px] top-1.5 h-[11px] w-[11px] rounded-full border-2 ${colorMap[meta.color]}`} />

            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <h3 className={`text-[13px] font-bold ${colorMap[meta.color].split(' ')[0]}`}>{meta.name}</h3>
                <span className="text-[10px] text-zinc-600">{meta.sub}</span>
              </div>
              <p className="text-[11px] text-zinc-500 mt-0.5">{meta.desc}</p>
            </div>

            <div className="space-y-2 mb-6">
              {weeks.map(w => {
                const p = weekProgress(w);
                const isOpen = openWeek === w.week;
                const isCurrent = currentWeek === w.week;
                return (
                  <div key={w.week}
                    className={`glass rounded-xl overflow-hidden transition-all duration-300 ${isOpen ? 'border-gold/30' : ''} ${isCurrent ? 'ring-1 ring-gold/25' : ''}`}>
                    <button onClick={() => setOpenWeek(isOpen ? null : w.week)}
                      className="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-white/[.02] transition">
                      <span className={`grid place-items-center h-8 w-8 rounded-lg text-[11px] font-bold shrink-0
                        ${p.pct === 100 ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                          : isCurrent ? 'bg-gold/20 text-gold border border-gold/30'
                            : 'bg-white/5 text-zinc-500 border border-white/10'}`}>
                        {p.pct === 100 ? <Icon n="check" size={14} strokeWidth={3} /> : 'W' + w.week}
                      </span>
                      <span className="min-w-0 flex-1">
                        <span className="flex items-center gap-2">
                          <span className="text-[13px] font-semibold text-zinc-100">Week {w.week} · {w.title}</span>
                          {isCurrent && <span className="text-[9px] font-bold text-gold bg-gold/15 border border-gold/30 rounded-full px-1.5 py-0.5">NOW</span>}
                        </span>
                        <span className="flex items-center gap-2 mt-1">
                          <span className="h-1 w-20 rounded-full bg-white/[.07] overflow-hidden">
                            <span className="block h-full rounded-full transition-all duration-700"
                              style={{ width: p.pct + '%', background: barMap[meta.color] }} />
                          </span>
                          <span className="text-[10px] text-zinc-600 tabular-nums">{p.done}/{p.total}</span>
                          <span className="text-[10px] text-zinc-600 am">{w.am}</span>
                        </span>
                      </span>
                      <Icon n="chev" size={15}
                        className={`text-zinc-600 shrink-0 transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`} />
                    </button>

                    <div className={`overflow-hidden transition-all duration-300 ${isOpen ? 'max-h-[420px] opacity-100' : 'max-h-0 opacity-0'}`}>
                      <div className="px-4 pb-4 pt-1 space-y-1.5 border-t border-white/[.06]">
                        {w.goals.map((g, i) => {
                          const checked = (data.weeks[w.week] || [])[i];
                          return (
                            <button key={i} onClick={() => toggleGoal(w.week, i)}
                              className="w-full flex items-start gap-2.5 text-left group py-1.5 active:scale-[.995] transition">
                              <span className={`mt-0.5 grid place-items-center h-[18px] w-[18px] rounded-md border shrink-0 transition-all duration-300
                                ${checked ? 'bg-emerald-500 border-emerald-400 text-black check-pop' : 'border-white/20 text-transparent group-hover:border-gold/50'}`}>
                                <Icon n="check" size={11} strokeWidth={3.5} />
                              </span>
                              <span className={`text-[12px] leading-snug ${checked ? 'text-zinc-600 line-through' : 'text-zinc-400 group-hover:text-zinc-200'} transition`}>
                                {g}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ============================================================
   ANALYTICS
   ============================================================ */
function Analytics({ data, setData, stats, showToast }) {
  const equity = useMemo(() => equityCurve(data.entries), [data.entries]);
  const fileRef = useRef(null);
  const settings = data.settings;
  const trades = useMemo(() => sortedTrades(data.entries), [data.entries]);

  const bySetup = useMemo(() => groupR(trades, e => [e.setup])
    .map(g => ({ ...g, subL: `Win rate ${fmtPct(g.winRate)}`, subR: `Avg ${fmtR(g.avg)}` }))
    .sort((a, b) => b.total - a.total), [trades]);
  const bySession = useMemo(() => groupR(trades, e => [e.session && e.session !== '—' ? e.session : null])
    .map(g => ({ ...g, subL: `Win rate ${fmtPct(g.winRate)}`, subR: `Avg ${fmtR(g.avg)}` }))
    .sort((a, b) => b.total - a.total), [trades]);
  const byDay = useMemo(() => groupR(trades, e => [weekdayOf(e.date)])
    .map(g => ({ ...g, subL: `Win rate ${fmtPct(g.winRate)}`, subR: `Avg ${fmtR(g.avg)}` }))
    .sort((a, b) => WEEKDAYS.indexOf(a.key) - WEEKDAYS.indexOf(b.key)), [trades]);
  const byMistake = useMemo(() => groupR(trades, e => e.mistakes || [])
    .map(g => ({ ...g, subL: `${g.count}× tagged`, subR: `Avg ${fmtR(g.avg)}` }))
    .sort((a, b) => a.total - b.total), [trades]);
  const byEmotion = useMemo(() => groupR(trades, e => [e.emotion]).sort((a, b) => b.total - a.total), [trades]);
  const byGrade = useMemo(() => groupR(trades, e => [e.grade])
    .map(g => ({ ...g, subL: `Win rate ${fmtPct(g.winRate)}`, subR: `Avg ${fmtR(g.avg)}` }))
    .sort((a, b) => GRADES.indexOf(a.key) - GRADES.indexOf(b.key)), [trades]);

  const insights = useMemo(() => buildInsights(data.entries, settings), [data.entries, settings]);
  const wk = useMemo(() => periodStats(data.entries, 7), [data.entries]);
  const usd = r => fmtMoney(r * settings.balance * settings.riskPct / 100);

  const copyReport = async () => {
    const st = wk.stats;
    const text = [
      `Dagi's 90-Day Gold — weekly review (${wk.from} → ${todayISO()})`,
      `Trades: ${st.count} (${st.wins}W / ${st.losses}L) · Win rate ${fmtPct(st.winRate)}`,
      `Net: ${fmtR(st.totalR)} (${usd(st.totalR)}) · Profit factor ${st.count ? (st.pf === Infinity ? '∞' : st.pf.toFixed(2)) : '—'}`,
      `Rule compliance: ${st.count ? fmtPct(st.compliance) : '—'} · Journaled ${wk.journaledDays}/7 days`
    ].join('\n');
    try { await navigator.clipboard.writeText(text); showToast('Weekly report copied'); }
    catch { showToast('Copy is not available in this browser', 'error'); }
  };

  const download = (blob, name) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 500);
  };

  const exportJSON = () => {
    download(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), `dagi90-journal-${todayISO()}.json`);
    showToast('JSON backup downloaded');
  };

  const exportCSV = () => {
    const headers = ['date', 'direction', 'setup', 'session', 'grade', 'riskPct', 'resultR', 'compliant', 'emotion', 'mistakes', 'notes'];
    const rows = data.entries.map(e => headers.map(h => {
      let v = h === 'compliant' ? (e.compliant ? 'Yes' : 'No') : h === 'mistakes' ? (e.mistakes || []).join('; ') : e[h];
      if (v === null || v === undefined) v = '';
      return `"${String(v).replace(/"/g, '""')}"`;
    }).join(','));
    download(new Blob(['﻿' + [headers.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8;' }), `dagi90-journal-${todayISO()}.csv`);
    showToast('CSV exported');
  };

  const importJSON = ev => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.entries)) throw new Error('bad');
        const entries = parsed.entries.filter(e => e && typeof e.date === 'string').map(normalizeEntry);
        setData(d => ({
          ...d,
          entries,
          checklist: parsed.checklist || d.checklist,
          weeks: parsed.weeks || d.weeks,
          startDate: parsed.startDate || d.startDate,
          lockDate: parsed.lockDate || null,
          settings: { ...d.settings, ...(parsed.settings || {}) }
        }));
        showToast(`Imported ${entries.length} entries`);
      } catch (err) {
        showToast('Invalid backup file', 'error');
      }
    };
    reader.readAsText(file);
    ev.target.value = '';
  };

  const resetAll = () => {
    if (!confirm('Erase ALL your data and start a fresh 90-day challenge? This cannot be undone.')) return;
    setData(d => ({ ...DEFAULT_DATA(), settings: d.settings }));
    showToast('All data reset', 'warn');
  };

  const toneCls = { good: 'text-emerald-300 bg-emerald-500/10 border-emerald-500/25', warn: 'text-amber-300 bg-amber-500/10 border-amber-500/25', info: 'text-zinc-400 bg-white/[.03] border-white/[.08]' };
  const toneIcon = { good: 'up', warn: 'alert', info: 'info' };

  return (
    <div className="space-y-4">
      <div>
        <h2 className="text-xl font-bold text-white">Analytics Hub</h2>
        <p className="text-[12px] text-zinc-500 am">የአፈጻጸም ትንተና</p>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard label="Total R Gained" value={fmtR(stats.totalR)} sub={`${stats.count} trades · ${usd(stats.totalR)}`} icon="up"
          tone={stats.totalR >= 0 ? 'emerald' : 'rose'} />
        <StatCard label="Profit Factor" value={stats.count === 0 ? '—' : (stats.pf === Infinity ? '∞' : stats.pf.toFixed(2))}
          sub="gross win / gross loss" icon="chart" tone={stats.pf >= 1.5 ? 'emerald' : 'zinc'} />
        <StatCard label="Win Rate" value={fmtPct(stats.winRate)} sub={`${stats.wins}W · ${stats.losses}L`} icon="target" tone="gold" />
        <StatCard label="Expectancy" value={stats.count === 0 ? '—' : fmtR(stats.expectancy)} sub="per trade" icon="activity"
          tone={stats.expectancy >= 0 ? 'emerald' : 'rose'} />
        <StatCard label="Max Drawdown" value={stats.count === 0 ? '—' : '-' + stats.maxDD.toFixed(2) + 'R'} sub="peak to trough" icon="alert"
          tone={stats.maxDD > 0 ? 'rose' : 'zinc'} />
        <StatCard label="Best / Worst" value={stats.count === 0 ? '—' : `${fmtR(stats.bestR)}`} sub={stats.count ? `worst ${fmtR(stats.worstR)}` : 'single trade'} icon="award" tone="emerald" />
        <StatCard label="Longest Streaks" value={`${stats.maxWinStreak}W · ${stats.maxLossStreak}L`} sub="consecutive" icon="flame" tone="gold" />
        <StatCard label="Avg Win : Loss" value={stats.avgLoss > 0 ? stats.avgRR.toFixed(2) : '—'} sub={`+${stats.avgWin.toFixed(2)}R / -${stats.avgLoss.toFixed(2)}R`} icon="zap"
          tone={stats.avgRR >= 1.5 ? 'emerald' : 'zinc'} />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="glass rounded-2xl p-5 glow fade-up">

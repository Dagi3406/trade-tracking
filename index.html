<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          obsidian: '#09090B',
          charcoal: '#18181B',
          gold: { DEFAULT: '#F59E0B', soft: '#FCD34D', deep: '#B45309' },
          em: '#10B981'
        },
        fontFamily: { sans: ['Inter', 'Noto Sans Ethiopic', 'system-ui', 'sans-serif'] }

<style>
  html, body { background: #09090B; }
  body {
    font-family: 'Inter', 'Noto Sans Ethiopic', system-ui, sans-serif;
    color: #E4E4E7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    background:
      radial-gradient(1100px 620px at 8% -12%, rgba(245,158,11,.11), transparent 62%),
      radial-gradient(900px 520px at 102% 2%, rgba(16,185,129,.09), transparent 60%),
      radial-gradient(800px 700px at 50% 120%, rgba(245,158,11,.05), transparent 60%),
      #09090B;
    background-attachment: fixed;
  }
  .am { font-family: 'Noto Sans Ethiopic', sans-serif; }

  .glass {
    background: linear-gradient(165deg, rgba(28,28,32,.92), rgba(12,12,14,.86));
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255,255,255,.07);
  }
  .glass-soft {
    background: linear-gradient(165deg, rgba(30,30,35,.7), rgba(14,14,16,.6));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.06);
  }
  .glow { transition: border-color .35s ease, box-shadow .35s ease, transform .35s ease; }
  .glow:hover {
    border-color: rgba(245,158,11,.36);
    box-shadow: 0 0 0 1px rgba(245,158,11,.12), 0 26px 64px -32px rgba(245,158,11,.6);
    transform: translateY(-2px);
  }
  .glow-em:hover {
    border-color: rgba(16,185,129,.4);
    box-shadow: 0 0 0 1px rgba(16,185,129,.14), 0 26px 64px -32px rgba(16,185,129,.6);
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .fade-up { animation: fadeUp .55s cubic-bezier(.16,1,.3,1) both; }

  @keyframes slideUp { from { opacity: 0; transform: translateY(48px) scale(.97); } to { opacity: 1; transform: none; } }
  .slide-up { animation: slideUp .42s cubic-bezier(.16,1,.3,1) both; }

  @keyframes popIn { 0% { opacity:0; transform: scale(.8); } 60% { transform: scale(1.06); } 100% { opacity:1; transform: scale(1); } }
  .pop-in { animation: popIn .45s cubic-bezier(.16,1,.3,1) both; }

  @keyframes pulseGold {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245,158,11,.45); }
    50%      { box-shadow: 0 0 0 12px rgba(245,158,11,0); }
  }
  .pulse-gold { animation: pulseGold 2s ease-out infinite; }

  @keyframes pulseRose {
    0%, 100% { box-shadow: 0 0 0 0 rgba(244,63,94,.5); }
    50%      { box-shadow: 0 0 0 14px rgba(244,63,94,0); }
  }
  .pulse-rose { animation: pulseRose 1.8s ease-out infinite; }

  @keyframes confettiFall {
    0%   { opacity: 1; transform: translateY(-14px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(360px) rotate(600deg); }
  }

  @keyframes shimmer {
    0%   { background-position: -220% 0; }
    100% { background-position: 220% 0; }
  }
  .shimmer-text {
    background: linear-gradient(100deg, #F59E0B 20%, #FDE68A 40%, #F59E0B 60%);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 5s linear infinite;
  }

  @keyframes floatGlow {
    0%, 100% { transform: translate(0,0) scale(1); opacity: .55; }
    50%      { transform: translate(20px,-20px) scale(1.1); opacity: .8; }
  }
  .float-glow { animation: floatGlow 9s ease-in-out infinite; }

  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-track { background: rgba(255,255,255,.02); }
  ::-webkit-scrollbar-thumb { background: rgba(245,158,11,.28); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(245,158,11,.5); }

  input, select, textarea { font-family: inherit; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.75) sepia(1) saturate(5) hue-rotate(2deg); cursor: pointer; }
  select > option { background: #18181B; color: #E4E4E7; }

  .check-pop { animation: popIn .35s cubic-bezier(.16,1,.3,1) both; }
</style>

<body>
<div id="root"></div>

<!-- Load React UMD builds FIRST -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- Load Babel standalone -->
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

<!-- Register a classic-runtime React preset to avoid ESM imports in a non-module script -->
<script>
  try {
    Babel.registerPreset('react-classic', {
      presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]]
    });
  } catch (e) {
    console.error('Failed to register react-classic preset:', e);
  }
</script>

<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useMemo, useRef } = React;

/* ============================================================
   CONSTANTS
   ============================================================ */
const LEGACY_KEY = 'dagi90.tracker.v1';
const USERS_KEY  = 'dagi90.users.v1';
const SESSION_KEY = 'dagi90.session.v1';
const DATA_PREFIX = 'dagi90.data.v1.';

/* ============================================================
   BASIC HELPERS
   ============================================================ */
const pad2 = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const isoAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const daysBetween = (a, b) => {
  const A = new Date(a + 'T00:00:00'), B = new Date(b + 'T00:00:00');
  return Math.round((B - A) / 86400000);
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtR = n => (n > 0 ? '+' : '') + Number(n).toFixed(2) + 'R';
const fmtPct = n => Number(n).toFixed(0) + '%';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ============================================================
   AUTH STORAGE
   ============================================================ */
function loadUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); }
  catch { return {}; }
}
function saveUsers(users) {
  try { localStorage.setItem(USERS_KEY, JSON.stringify(users)); } catch {}
}
function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if (!s || !s.userId) return null;
    if (s.expiresAt && Date.now() > s.expiresAt) { clearSession(); return null; }
    // Ensure user still exists
    const users = loadUsers();
    const exists = Object.values(users).some(u => u.id === s.userId);
    if (!exists) { clearSession(); return null; }
    return s;
  } catch { return null; }
}
function saveSession(s) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch {}
}
function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch {}
}
function genSalt() {
  const arr = new Uint8Array(16);
  if (typeof crypto !== 'undefined' && crypto.getRandomValues) crypto.getRandomValues(arr);
  else for (let i = 0; i < arr.length; i++) arr[i] = Math.floor(Math.random() * 256);
  return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function hashPassword(password, salt) {
  const input = salt + ':' + password;
  if (typeof crypto !== 'undefined' && crypto.subtle) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(input));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { /* fall through */ }
  }
  // Synchronous fallback for environments without crypto.subtle (e.g. some file:// browsers)
  let h1 = 0x811c9dc5, h2 = 0x811c9dc5;
  for (let i = 0; i < input.length; i++) {
    const c = input.charCodeAt(i);
    h1 ^= c; h1 = Math.imul(h1, 0x01000193) >>> 0;
    h2 = Math.imul(h2 ^ c, 0x85ebca6b) >>> 0;
  }
  return h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
}

/* ============================================================
   PER-USER DATA STORAGE
   ============================================================ */
const DEFAULT_DATA = () => ({
  version: 1,
  startDate: todayISO(),
  entries: [],
  checklist: {},
  weeks: {},
  lockDate: null
});

function dataKey(userId) { return DATA_PREFIX + userId; }

function loadUserData(userId) {
  try {
    const raw = localStorage.getItem(dataKey(userId));
    if (!raw) return DEFAULT_DATA();
    const parsed = JSON.parse(raw);
    return { ...DEFAULT_DATA(), ...parsed, entries: Array.isArray(parsed.entries) ? parsed.entries : [] };
  } catch { return DEFAULT_DATA(); }
}
function saveUserData(userId, data) {
  try { localStorage.setItem(dataKey(userId), JSON.stringify(data)); } catch {}
}

/* ============================================================
   STATS
   ============================================================ */
function computeStats(entries) {
  const tr = entries.filter(e => e.direction !== 'No Trade' && typeof e.resultR === 'number');
  const wins = tr.filter(e => e.resultR > 0);
  const losses = tr.filter(e => e.resultR < 0);
  const totalR = tr.reduce((s, e) => s + e.resultR, 0);
  const gp = wins.reduce((s, e) => s + e.resultR, 0);
  const gl = Math.abs(losses.reduce((s, e) => s + e.resultR, 0));
  const pf = gl > 0 ? gp / gl : (gp > 0 ? Infinity : 0);
  const winRate = tr.length ? (wins.length / tr.length) * 100 : 0;
  const avgWin = wins.length ? gp / wins.length : 0;
  const avgLoss = losses.length ? gl / losses.length : 0;
  const expectancy = tr.length ? totalR / tr.length : 0;
  const compliance = tr.length ? (tr.filter(e => e.compliant).length / tr.length) * 100 : 0;
  return { count: tr.length, wins: wins.length, losses: losses.length, totalR, gp, gl, pf, winRate, avgWin, avgLoss, expectancy, compliance };
}

function equityCurve(entries) {
  const s = [...entries]
    .filter(e => e.direction !== 'No Trade' && typeof e.resultR === 'number')
    .sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  let c = 0;
  return s.map(e => (c += e.resultR));
}

function lossStreak(entries) {
  const s = [...entries]
    .filter(e => e.direction !== 'No Trade' && typeof e.resultR === 'number')
    .sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  let n = 0;
  for (let i = s.length - 1; i >= 0; i--) { if (s[i].resultR < 0) n++; else break; }
  return n;
}

/* ============================================================
   ICONS
   ============================================================ */
const ICONS = {
  dash: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  book: '<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  map: '<path d="M14.1 5.6a2 2 0 0 0 1.8 0l3.6-1.8A1 1 0 0 1 21 4.6v12.8a1 1 0 0 1-.6.9l-4.5 2.3a2 2 0 0 1-1.8 0l-4.2-2.1a2 2 0 0 0-1.8 0l-3.7 1.8A1 1 0 0 1 3 19.4V6.6a1 1 0 0 1 .6-.9l4.5-2.3a2 2 0 0 1 1.8 0z"/><path d="M15 5.8v15"/><path d="M9 3.2v15"/>',
  chart: '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  alert: '<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  unlock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
  up: '<path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/>',
  target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.7 9a1 1 0 0 1-.7 0C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.2-2.7a1.2 1.2 0 0 1 1.5 0C14.5 3.8 17 5 19 5a1 1 0 0 1 1 1z"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  spark: '<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>',
  reset: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  award: '<circle cx="12" cy="8" r="6"/><path d="M15.5 12.9 17 22l-5-3-5 3 1.5-9.1"/>',
  zap: '<path d="M4 14a1 1 0 0 1-.8-1.6l9.9-10.2a.5.5 0 0 1 .9.5l-1.9 6a1 1 0 0 0 .9 1.3h7a1 1 0 0 1 .8 1.6l-9.9 10.2a.5.5 0 0 1-.9-.5l1.9-6a1 1 0 0 0-.9-1.3z"/>',
  cal: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/>',
  brain: '<path d="M12 5a3 3 0 1 0-6 .1 4 4 0 0 0-2.5 5.8 4 4 0 0 0 .5 6.6A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 6 .1 4 4 0 0 1 2.5 5.8 4 4 0 0 1-.5 6.6A4 4 0 1 1 12 18Z"/>',
  circleCheck: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.4-.5-2-1-3-1.1-2.1-.2-4 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.2.4-2.3 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  filter: '<path d="M22 3H2l8 9.5V19l4 2v-8.5z"/>',
  activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  arrow: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  menu: '<path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>',
  eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff: '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  mail: '<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>'
};

function Icon({ n, size = 18, className = '', strokeWidth = 1.8 }) {
  return (
    <svg
      width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth={strokeWidth}
      strokeLinecap="round" strokeLinejoin="round"
      className={className}
      dangerouslySetInnerHTML={{ __html: ICONS[n] || '' }}
    />
  );
}

/* ============================================================
   SHARED UI
   ============================================================ */
function ProgressRing({ value, max = 100, size = 190, stroke = 13, color = 'gold', children }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const pct = clamp(value / max, 0, 1);
  const gid = useMemo(() => 'g' + Math.random().toString(36).slice(2, 9), []);
  const stops = {
    gold: ['#B45309', '#F59E0B', '#FDE68A'],
    emerald: ['#065F46', '#10B981', '#6EE7B7'],
    rose: ['#9F1239', '#F43F5E', '#FDA4AF']
  }[color];

  return (
    <div className="relative" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90 block">
        <defs>
          <linearGradient id={gid} x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor={stops[0]} />
            <stop offset="55%" stopColor={stops[1]} />
            <stop offset="100%" stopColor={stops[2]} />
          </linearGradient>
        </defs>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="rgba(255,255,255,.06)" strokeWidth={stroke} />
        <circle
          cx={size / 2} cy={size / 2} r={r} fill="none"
          stroke={`url(#${gid})`} strokeWidth={stroke} strokeLinecap="round"
          strokeDasharray={c}
          strokeDashoffset={c * (1 - pct)}
          style={{ transition: 'stroke-dashoffset 1.3s cubic-bezier(.16,1,.3,1)', filter: 'drop-shadow(0 0 8px rgba(245,158,11,.35))' }}
        />
      </svg>
      <div className="absolute inset-0 grid place-items-center text-center">{children}</div>
    </div>
  );
}

function Toast({ toast }) {
  if (!toast) return null;
  const tone = toast.type === 'error'
    ? 'border-rose-500/40 text-rose-300'
    : toast.type === 'warn'
      ? 'border-amber-500/40 text-amber-300'
      : 'border-emerald-500/40 text-emerald-300';
  return (
    <div className="fixed left-1/2 -translate-x-1/2 bottom-24 md:bottom-8 z-[60] pointer-events-none">
      <div className={`glass rounded-xl px-4 py-2.5 text-sm font-medium shadow-2xl slide-up ${tone}`}>
        {toast.msg}
      </div>
    </div>
  );
}

function Countdown() {
  const [left, setLeft] = useState('00:00:00');
  useEffect(() => {
    const tick = () => {
      const n = new Date();
      const m = new Date(n); m.setHours(24, 0, 0, 0);
      const s = Math.max(0, Math.floor((m - n) / 1000));
      setLeft(`${pad2(Math.floor(s / 3600))}:${pad2(Math.floor((s % 3600) / 60))}:${pad2(s % 60)}`);
    };
    tick();
    const t = setInterval(tick, 1000);
    return () => clearInterval(t);
  }, []);
  return <span className="font-mono tabular-nums text-gold tracking-tight">{left}</span>;
}

/* ============================================================
   CHECKLIST
   ============================================================ */
const CHECKLIST_ITEMS = [
  { en: 'Pre-market HTF bias + news check', am: 'የገበያ ቅድመ-ትንተና' },
  { en: 'Marked FVG / liquidity zones', am: 'የዋጋ ደረጃዎች ምልክት' },
  { en: 'Risk per trade ≤ 0.5% confirmed', am: 'የስጋት አስተዳደር' },
  { en: 'Session journal entry logged', am: 'የግብይት መዝገብ' }
];

function Confetti({ trigger }) {
  const [pieces, setPieces] = useState([]);
  useEffect(() => {
    if (!trigger) return;
    const colors = ['#F59E0B', '#FCD34D', '#FDE68A', '#10B981', '#34D399', '#FFFFFF'];
    const arr = Array.from({ length: 40 }, (_, i) => ({
      id: trigger + '-' + i,
      left: Math.random() * 100,
      delay: Math.random() * 0.3,
      dur: 1.2 + Math.random() * 1.0,
      color: colors[i % colors.length],
      w: 4 + Math.random() * 6,
      h: 3 + Math.random() * 5
    }));
    setPieces(arr);
    const t = setTimeout(() => setPieces([]), 2800);
    return () => clearTimeout(t);
  }, [trigger]);

  return (
    <div className="pointer-events-none absolute inset-0 overflow-hidden rounded-2xl">
      {pieces.map(p => (
        <span key={p.id}
          className="absolute top-0 rounded-[2px]"

            animation: `confettiFall ${p.dur}s ${p.delay}s cubic-bezier(.2,.6,.4,1) forwards`
          }}
        />
      ))}
    </div>
  );
}

function EquityChart({ values, height = 150 }) {
  const W = 100, H = 100, pad = 4;
  const gid = useMemo(() => 'eq' + Math.random().toString(36).slice(2, 8), []);

  if (values.length === 0) {
    return (
      <div className="flex flex-col items-center justify-center text-center" style={{ height }}>
        <Icon n="activity" size={26} className="text-zinc-700 mb-2" />
        <p className="text-xs text-zinc-600">No trades yet — your equity curve will appear here.</p>
      </div>
    );
  }
  const all = [0, ...values];
  const min = Math.min(...all), max = Math.max(...all);
  const range = (max - min) || 1;
  const x = i => all.length === 1 ? W / 2 : pad + (i / (all.length - 1)) * (W - pad * 2);
  const y = v => pad + (1 - (v - min) / range) * (H - pad * 2);

  const pts = all.map((v, i) => `${x(i)},${y(v)}`);
  const line = 'M' + pts.join(' L');
  const area = `${line} L${x(all.length - 1)},${H - pad} L${x(0)},${H - pad} Z`;
  const positive = values[values.length - 1] >= 0;

  return (
    <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{ height, width: '100%' }} className="overflow-visible">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={positive ? '#10B981' : '#F43F5E'} stopOpacity="0.35" />
          <stop offset="100%" stopColor={positive ? '#10B981' : '#F43F5E'} stopOpacity="0" />
        </linearGradient>
      </defs>
      {min < 0 && max > 0 && (
        <line x1={pad} x2={W - pad} y1={y(0)} y2={y(0)} stroke="rgba(255,255,255,.12)" strokeWidth="1" strokeDasharray="2 3" vectorEffect="non-scaling-stroke" />
      )}
      <path d={area} fill={`url(#${gid})`} />
      <path d={line} fill="none" stroke={positive ? '#10B981' : '#F43F5E'} strokeWidth="2"
        strokeLinejoin="round" strokeLinecap="round" vectorEffect="non-scaling-stroke"
        style={{ filter: `drop-shadow(0 0 5px ${positive ? 'rgba(16,185,129,.55)' : 'rgba(244,63,94,.55)'})` }} />
    </svg>
  );
}

function Journal({ data, setData, lockedToday, onAdd, onDelete, showToast }) {
  const [q, setQ] = useState('');
  const [setupF, setSetupF] = useState('All');
  const [dirF, setDirF] = useState('All');
  const [ruleF, setRuleF] = useState('All');

  const filtered = useMemo(() => {
    return [...data.entries]
      .filter(e => {
        if (setupF !== 'All' && e.setup !== setupF) return false;
        if (dirF !== 'All' && e.direction !== dirF) return false;
        if (ruleF === 'Followed' && !e.compliant) return false;
        if (ruleF === 'Broke' && e.compliant) return false;
        if (q) {
          const hay = `${e.setup} ${e.notes} ${e.emotion} ${e.date} ${e.direction}`.toLowerCase();
          if (!hay.includes(q.toLowerCase())) return false;
        }
        return true;
      })
      .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  }, [data.entries, q, setupF, dirF, ruleF]);

  const selCls = "bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-[12px] text-zinc-300 outline-none focus:border-gold/60 transition [&>option]:bg-[#18181B]";

function Roadmap({ data, setData, dayNum }) {
  const currentWeek = clamp(Math.ceil(dayNum / 7), 1, 13);
  const [openWeek, setOpenWeek] = useState(currentWeek);

  const toggleGoal = (week, idx) => {
    setData(d => {
      const cur = d.weeks[week] || [];
      const next = [...cur];
      next[idx] = !next[idx];
      return { ...d, weeks: { ...d.weeks, [week]: next } };
    });
  };

  const weekProgress = w => {
    const arr = data.weeks[w.week] || [];
    const done = w.goals.filter((_, i) => arr[i]).length;
    return { done, total: w.goals.length, pct: (done / w.goals.length) * 100 };
  };

  const totalGoals = ROADMAP.reduce((s, w) => s + w.goals.length, 0);
  const totalDone = ROADMAP.reduce((s, w) => {
    const arr = data.weeks[w.week] || [];
    return s + w.goals.filter((_, i) => arr[i]).length;
  }, 0);

  return (
    <div className="space-y-4">
      <div className="flex flex-col sm:flex-row sm:items-end justify-between gap-3">
        <div>
          <h2 className="text-xl font-bold text-white">13-Week Roadmap</h2>
          <p className="text-[12px] text-zinc-500 am">የ13 ሳምንት ዕቅድ</p>
        </div>
        <div className="glass-soft rounded-xl px-4 py-2.5 border border-white/[.06]">
          <div className="flex items-center gap-3">
            <div className="text-right">
              <div className="text-[10px] uppercase tracking-wider text-zinc-500">Overall</div>
              <div className="text-sm font-bold text-white tabular-nums">{totalDone}/{totalGoals}</div>
            </div>
            <div className="h-8 w-px bg-white/10" />
            <div className="text-right">
              <div className="text-[10px] uppercase tracking-wider text-zinc-500">Week</div>
              <div className="text-sm font-bold text-gold tabular-nums">{currentWeek} / 13</div>
            </div>
          </div>
        </div>
      </div>

      {[1, 2, 3].map(phase => {
        const meta = PHASE_META[phase];
        const weeks = ROADMAP.filter(w => w.phase === phase);
        const colorMap = {
          gold: 'text-gold border-gold/30 bg-gold/10',
          sky: 'text-sky-400 border-sky-500/30 bg-sky-500/10',
          emerald: 'text-emerald-400 border-emerald-500/30 bg-emerald-500/10'
        };
        const barMap = {
          gold: 'linear-gradient(90deg,#B45309,#F59E0B,#FCD34D)',
          sky: 'linear-gradient(90deg,#0369A1,#0EA5E9,#7DD3FC)',
          emerald: 'linear-gradient(90deg,#065F46,#10B981,#6EE7B7)'
        };
        return (
          <div key={phase} className="relative pl-5 sm:pl-7 fade-up" style={{ animationDelay: (phase * 90) + 'ms' }}>
            <div className="absolute left-0 top-2 bottom-2 w-px bg-gradient-to-b from-white/20 via-white/10 to-transparent" />
            <div className={`absolute left-[-5px] top-1.5 h-[11px] w-[11px] rounded-full border-2 ${colorMap[meta.color]}`} />

            <div className="mb-3">
              <div className="flex items-center gap-2 flex-wrap">
                <h3 className={`text-[13px] font-bold ${colorMap[meta.color].split(' ')[0]}`}>{meta.name}</h3>
                <span className="text-[10px] text-zinc-600">{meta.sub}</span>
              </div>
              <p className="text-[11px] text-zinc-500 mt-0.5">{meta.desc}</p>
            </div>

            <div className="space-y-2 mb-6">
              {weeks.map(w => {
                const p = weekProgress(w);
                const isOpen = openWeek === w.week;
                const isCurrent = currentWeek === w.week;
                return (
                  <div key={w.week}
                    className={`glass rounded-xl overflow-hidden transition-all duration-300 ${isOpen ? 'border-gold/30' : ''} ${isCurrent ? 'ring-1 ring-gold/25' : ''}`}>
                    <button onClick={() => setOpenWeek(isOpen ? null : w.week)}
                      className="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-white/[.02] transition">
                      <span className={`grid place-items-center h-8 w-8 rounded-lg text-[11px] font-bold shrink-0
                        ${p.pct === 100 ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
                          : isCurrent ? 'bg-gold/20 text-gold border border-gold/30'
                            : 'bg-white/5 text-zinc-500 border border-white/10'}`}>
                        {p.pct === 100 ? <Icon n="check" size={14} strokeWidth={3} /> : 'W' + w.week}
                      </span>
                      <span className="min-w-0 flex-1">
                        <span className="flex items-center gap-2">
                          <span className="text-[13px] font-semibold text-zinc-100">Week {w.week} · {w.title}</span>
                          {isCurrent && <span className="text-[9px] font-bold text-gold bg-gold/15 border border-gold/30 rounded-full px-1.5 py-0.5">NOW</span>}
                        </span>
                        <span className="flex items-center gap-2 mt-1">
                          <span className="h-1 w-20 rounded-full bg-white/[.07] overflow-hidden">
                            <span className="block h-full rounded-full transition-all duration-700"
                              style={{ width: p.pct + '%', background: barMap[meta.color] }} />
                          </span>
                          <span className="text-[10px] text-zinc-600 tabular-nums">{p.done}/{p.total}</span>
                          <span className="text-[10px] text-zinc-600 am">{w.am}</span>
                        </span>
                      </span>
                      <Icon n="chev" size={15}
                        className={`text-zinc-600 shrink-0 transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`} />
                    </button>

                    <div className={`overflow-hidden transition-all duration-300 ${isOpen ? 'max-h-[420px] opacity-100' : 'max-h-0 opacity-0'}`}>
                      <div className="px-4 pb-4 pt-1 space-y-1.5 border-t border-white/[.06]">
                        {w.goals.map((g, i) => {
                          const checked = (data.weeks[w.week] || [])[i];
                          return (
                            <button key={i} onClick={() => toggleGoal(w.week, i)}
                              className="w-full flex items-start gap-2.5 text-left group py-1.5 active:scale-[.995] transition">
                              <span className={`mt-0.5 grid place-items-center h-[18px] w-[18px] rounded-md border shrink-0 transition-all duration-300
                                ${checked ? 'bg-emerald-500 border-emerald-400 text-black check-pop' : 'border-white/20 text-transparent group-hover:border-gold/50'}`}>
                                <Icon n="check" size={11} strokeWidth={3.5} />
                              </span>
                              <span className={`text-[12px] leading-snug ${checked ? 'text-zinc-600 line-through' : 'text-zinc-400 group-hover:text-zinc-200'} transition`}>
                                {g}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function Analytics({ data, setData, stats, showToast }) {
  const equity = useMemo(() => equityCurve(data.entries), [data.entries]);
  const fileRef = useRef(null);

  const bySetup = useMemo(() => {
    const map = {};
    data.entries
      .filter(e => e.direction !== 'No Trade' && typeof e.resultR === 'number')
      .forEach(e => {
        if (!map[e.setup]) map[e.setup] = { count: 0, total: 0, wins: 0 };
        map[e.setup].count++;
        map[e.setup].total += e.resultR;
        if (e.resultR > 0) map[e.setup].wins++;
      });
    return Object.entries(map)
      .map(([k, v]) => ({ setup: k, ...v, avg: v.total / v.count, winRate: (v.wins / v.count) * 100 }))
      .sort((a, b) => b.total - a.total);
  }, [data.entries]);

  const byEmotion = useMemo(() => {
    const map = {};
    data.entries
      .filter(e => e.direction !== 'No Trade' && typeof e.resultR === 'number')
      .forEach(e => {
        if (!map[e.emotion]) map[e.emotion] = { count: 0, total: 0 };
        map[e.emotion].count++;
        map[e.emotion].total += e.resultR;
      });
    return Object.entries(map)
      .map(([k, v]) => ({ emotion: k, ...v }))
      .sort((a, b) => b.total - a.total);
  }, [data.entries]);

  const maxAbs = Math.max(1, ...bySetup.map(s => Math.abs(s.total)));

  const exportJSON = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `dagi90-journal-${todayISO()}.json`; a.click();
    URL.revokeObjectURL(url);
    showToast('JSON backup downloaded');
  };

  const exportCSV = () => {
    const headers = ['date', 'direction', 'setup', 'riskPct', 'resultR', 'compliant', 'emotion', 'notes'];
    const rows = data.entries.map(e => headers.map(h => {
      let v = h === 'compliant' ? (e.compliant ? 'Yes' : 'No') : e[h];
      if (v === null || v === undefined) v = '';
      return `"${String(v).replace(/"/g, '""')}"`;
    }).join(','));
    const csv = [headers.join(','), ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `dagi90-journal-${todayISO()}.csv`; a.click();
    URL.revokeObjectURL(url);
    showToast('CSV exported');
  };

  const importJSON = ev => {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed || !Array.isArray(parsed.entries)) throw new Error('bad');
        setData(d => ({
          ...d,
          entries: parsed.entries,
          checklist: parsed.checklist || d.checklist,
          weeks: parsed.weeks || d.weeks,
          startDate: parsed.startDate || d.startDate,
          lockDate: parsed.lockDate || null
        }));
        showToast(`Imported ${parsed.entries.length} entries`);
      } catch (err) {
        showToast('Invalid backup file', 'error');
      }
    };
    reader.readAsText(file);
    ev.target.value = '';
  };

  const resetAll = () => {
    if (!confirm('Erase ALL your data and start a fresh 90-day challenge? This cannot be undone.')) return;
    setData(DEFAULT_DATA());
    showToast('All data reset', 'warn');
  };

  return (
    <div className="space-y-4">
      <div>
        <h2 className="text-xl font-bold text-white">Analytics Hub</h2>
        <p className="text-[12px] text-zinc-500 am">የአፈጻጸም ትንተና</p>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        <StatCard label="Total R Gained" value={fmtR(stats.totalR)} sub={`${stats.count} trades`} icon="up"
          tone={stats.totalR >= 0 ? 'emerald' : 'rose'} />
        <StatCard label="Profit Factor" value={stats.count === 0 ? '—' : (stats.pf === Infinity ? '∞' : stats.pf.toFixed(2))}
          sub="gross win / gross loss" icon="chart" tone={stats.pf >= 1.5 ? 'emerald' : 'zinc'} />
        <StatCard label="Win Rate" value={fmtPct(stats.winRate)} sub={`${stats.wins}W · ${stats.losses}L`} icon="target" tone="gold" />
        <StatCard label="Expectancy" value={stats.count === 0 ? '—' : fmtR(stats.expectancy)} sub="per trade" icon="activity"
          tone={stats.expectancy >= 0 ? 'emerald' : 'rose'} />
      </div>

      <div className="glass rounded-2xl p-5 glow fade-up">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-semibold text-white text-[15px] flex items-center gap-2">
            <Icon n="activity" size={17} className="text-gold" /> Equity Curve (R)
          </h3>
          <div className="text-[11px] text-zinc-500">
            Avg Win <span className="text-emerald-400 font-semibold tabular-nums">{stats.avgWin.toFixed(2)}R</span>
            <span className="mx-2 text-zinc-700">|</span>
            Avg Loss <span className="text-rose-400 font-semibold tabular-nums">-{stats.avgLoss.toFixed(2)}R</span>
          </div>
        </div>
        <EquityChart values={equity} height={190} />
        <div className="flex items-center justify-between mt-2 text-[10px] text-zinc-600">
          <span>Start</span>
          <span>{equity.length} closed trades</span>
          <span>Latest</span>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="glass rounded-2xl p-5 glow fade-up">
          <h3 className="font-semibold text-white text-[15px] flex items-center gap-2 mb-4">
            <Icon n="target" size={17} className="text-gold" /> Performance by Setup
          </h3>
          {bySetup.length === 0 ? (
            <p className="text-xs text-zinc-600 py-6 text-center">No trade data yet.</p>
          ) : (
            <div className="space-y-3">
              {bySetup.map((s, i) => {
                const pos = s.total >= 0;
                const w = (Math.abs(s.total) / maxAbs) * 100;
                return (
                  <div key={s.setup} className="fade-up" style={{ animationDelay: i * 60 + 'ms' }}>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-[12px] text-zinc-300">{s.setup}</span>
                      <span className="text-[11px] tabular-nums">
                        <span className={pos ? 'text-emerald-400 font-semibold' : 'text-rose-400 font-semibold'}>{fmtR(s.total)}</span>
                        <span className="text-zinc-600 ml-1.5">({s.count})</span>
                      </span>
                    </div>
                    <div className="h-2 w-full rounded-full bg-white/[.05] overflow-hidden">
                      <div className="h-full rounded-full transition-all duration-1000"
                        style={{
                          width: w + '%',
                          background: pos ? 'linear-gradient(90deg,#065F46,#10B981,#6EE7B7)' : 'linear-gradient(90deg,#9F1239,#F43F5E,#FDA4AF)'

                    <div className="flex items-center justify-between text-[10px] text-zinc-600 mt-0.5">
                      <span>Win rate {fmtPct(s.winRate)}</span>

        <div className="glass rounded-2xl p-5 glow fade-up">
          <h3 className="font-semibold text-white text-[15px] flex items-center gap-2 mb-4">
            <Icon n="brain" size={17} className="text-rose-400" /> Psychology Breakdown
          </h3>
          {byEmotion.length === 0 ? (
            <p className="text-xs text-zinc-600 py-6 text-center">No trade data yet.</p>
          ) : (
            <div className="space-y-2">
              {byEmotion.map((e, i) => {
                const pos = e.total >= 0;
                return (
                  <div key={e.emotion}
                    className="flex items-center justify-between rounded-xl bg-white/[.025] border border-white/[.06] px-3 py-2.5 fade-up"

                    <div className="flex items-center gap-2.5">

                      <span className="text-[12px] text-zinc-300">{e.emotion}</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="text-[10px] text-zinc-600">{e.count} trades</span>
                      <span className={`text-[12px] font-bold tabular-nums ${pos ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {fmtR(e.total)}

          <div className="mt-4 pt-4 border-t border-white/[.07]">
            <div className="flex items-center justify-between mb-2">
              <span className="text-[11px] text-zinc-500">Rule compliance rate</span>
              <span className={`text-[12px] font-bold tabular-nums ${stats.compliance >= 80 ? 'text-emerald-400' : stats.compliance >= 50 ? 'text-gold' : 'text-rose-400'}`}>
                {stats.count ? fmtPct(stats.compliance) : '—'}

        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">

    </div>
  );
}

function AuthScreen({ onAuth }) {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [confirm, setConfirm] = useState('');
  const [showPw, setShowPw] = useState(false);
  const [remember, setRemember] = useState(true);
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const fieldCls = "w-full bg-black/40 border border-white/10 rounded-xl px-3.5 py-3 text-sm text-zinc-200 outline-none focus:border-gold/60 focus:ring-2 focus:ring-gold/15 transition placeholder:text-zinc-600";
  const labelCls = "block text-[11px] uppercase tracking-wider text-zinc-500 font-medium mb-1.5";

  const switchMode = (m) => {
    setMode(m);
    setError('');
    setPassword('');
    setConfirm('');
  };

  const submit = async (e) => {
    e.preventDefault();
    if (busy) return;
    setError('');

    const emailNorm = email.trim().toLowerCase();
    if (!emailNorm || !password) { setError('Please fill in all fields.'); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailNorm)) { setError('Please enter a valid email address.'); return; }
    if (password.length < 6) { setError('Password must be at least 6 characters.'); return; }

    const users = loadUsers();
    setBusy(true);
    try {
      if (mode === 'signup') {
        if (users[emailNorm]) { setError('An account with that email already exists.'); setBusy(false); return; }
        if (password !== confirm) { setError('Passwords do not match.'); setBusy(false); return; }
        if (!name.trim()) { setError('Please enter your name.'); setBusy(false); return; }

        const salt = genSalt();
        const hash = await hashPassword(password, salt);
        const user = {
          id: uid(),
          email: emailNorm,
          name: name.trim(),
          salt,
          hash,
          createdAt: Date.now()
        };
        users[emailNorm] = user;
        const isFirstAccount = Object.keys(users).length === 1;
        saveUsers(users);

        // Initialize this user's data. Migrate legacy anonymous data on first-ever signup.
        let initial = DEFAULT_DATA();
        if (isFirstAccount) {
          try {
            const legacyRaw = localStorage.getItem(LEGACY_KEY);
            if (legacyRaw) {
              const parsed = JSON.parse(legacyRaw);
              initial = { ...DEFAULT_DATA(), ...parsed };
              localStorage.removeItem(LEGACY_KEY);
            }
          } catch {}
        }
        saveUserData(user.id, initial);

        const session = {
          userId: user.id,
          email: user.email,
          name: user.name,
          createdAt: Date.now(),
          expiresAt: remember ? Date.now() + 30 * 24 * 3600 * 1000 : Date.now() + 24 * 3600 * 1000
        };
        saveSession(session);
        onAuth(session);
      } else {
        const user = users[emailNorm];
        if (!user) { setError('No account found with that email.'); setBusy(false); return; }
        const hash = await hashPassword(password, user.salt);
        if (hash !== user.hash) { setError('Incorrect password.'); setBusy(false); return; }

        const session = {
          userId: user.id,
          email: user.email,
          name: user.name,
          createdAt: Date.now(),
          expiresAt: remember ? Date.now() + 30 * 24 * 3600 * 1000 : Date.now() + 24 * 3600 * 1000
        };
        saveSession(session);
        onAuth(session);
      }
    } catch (err) {
      setError('Something went wrong. Please try again.');
    }
    setBusy(false);
  };

  return (
    <div className="min-h-screen grid lg:grid-cols-2">
      {/* Left branding */}
      <div className="hidden lg:flex flex-col justify-between p-10 relative overflow-hidden border-r border-white/[.06]">
        <div className="absolute -top-40 -left-40 h-[500px] w-[500px] rounded-full bg-gold/[.08] blur-3xl float-glow pointer-events-none" />
        <div className="absolute -bottom-40 -right-40 h-[500px] w-[500px] rounded-full bg-emerald-500/[.06] blur-3xl float-glow pointer-events-none" style={{ animationDelay: '-4s' }} />

        <div className="relative">
          <div className="flex items-center gap-3">
            <div className="grid place-items-center h-11 w-11 rounded-xl bg-gradient-to-br from-gold-soft to-gold-deep shadow-lg shadow-gold/20">
              <span className="text-black font-extrabold text-sm">Au</span>
            </div>
            <div>
              <div className="text-[13px] font-bold text-white">Dagi's 90-Day Gold</div>
              <div className="text-[10px] text-zinc-500 am">የወርቅ ግብይት ስነ-ስርዓት</div>
            </div>
          </div>
        </div>

        <div className="relative max-w-md">
          <h2 className="text-4xl font-bold text-white leading-tight">
            Discipline <span className="shimmer-text">beats</span><br />prediction.
          </h2>
          <p className="text-sm text-zinc-500 mt-4 leading-relaxed">
            Track 90 days of XAUUSD trading with a focus on process, not outcomes. Journal every trade, follow the rules, build an edge.
          </p>
          <div className="grid grid-cols-3 gap-3 mt-8">
            {[
              { v: '90', l: 'Days' },
              { v: '0.5%', l: 'Max Risk' },
              { v: '1%', l: 'Daily Stop' }
            ].map((s, i) => (
              <div key={i} className="glass-soft rounded-xl p-3 border border-white/[.06]">
                <div className="text-lg font-bold text-gold tabular-nums">{s.v}</div>
                <div className="text-[10px] text-zinc-500 uppercase tracking-wider">{s.l}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="relative text-[11px] text-zinc-600">
          <p>All data is stored locally in your browser.</p>
          <p className="am mt-1">ሁሉም መረጃ በአሳሽዎ ውስጥ ብቻ ይቀመጣል።</p>
        </div>
      </div>

      {/* Right form */}
      <div className="flex items-center justify-center p-5 sm:p-10 relative">
        <div className="absolute top-5 left-5 lg:hidden flex items-center gap-2.5">
          <div className="grid place-items-center h-9 w-9 rounded-xl bg-gradient-to-br from-gold-soft to-gold-deep shadow-lg shadow-gold/20">
            <span className="text-black font-extrabold text-[13px]">Au</span>
          </div>
          <div>
            <div className="text-[13px] font-bold text-white leading-tight">Dagi's 90-Day Gold</div>
            <div className="text-[10px] text-zinc-500 leading-tight">Trading Discipline Tracker</div>
          </div>
        </div>

        <div className="w-full max-w-sm mt-16 lg:mt-0 fade-up">
          <div className="mb-6">
            <h1 className="text-2xl font-bold text-white">
              {mode === 'login' ? 'Welcome back' : 'Create your account'}
            </h1>
            <p className="text-[12px] text-zinc-500 mt-1">
              {mode === 'login' ? 'Sign in to continue your 90-day challenge.' : 'Start your 90-day discipline journey today.'}
            </p>
          </div>

          <form onSubmit={submit} className="space-y-3.5">
            {mode === 'signup' && (
              <div>
                <label className={labelCls}>Name</label>
                <div className="relative">
                  <Icon n="user" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" />
                  <input type="text" value={name} onChange={e => setName(e.target.value)}
                    placeholder="Dagi" autoComplete="name"
                    className={fieldCls + ' pl-9'} />
                </div>
              </div>
            )}

            <div>
              <label className={labelCls}>Email</label>
              <div className="relative">
                <Icon n="mail" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" />
                <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                  placeholder="you@example.com" autoComplete="email" autoFocus
                  className={fieldCls + ' pl-9'} />
              </div>
            </div>

            <div>
              <label className={labelCls}>Password</label>
              <div className="relative">
                <Icon n="lock" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" />
                <input type={showPw ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)}
                  placeholder="••••••••" autoComplete={mode === 'login' ? 'current-password' : 'new-password'}
                  className={fieldCls + ' pl-9 pr-10'} />
                <button type="button" onClick={() => setShowPw(v => !v)}
                  className="absolute right-2 top-1/2 -translate-y-1/2 p-1.5 rounded-lg text-zinc-500 hover:text-zinc-300 transition active:scale-90">
                  <Icon n={showPw ? 'eyeOff' : 'eye'} size={15} />
                </button>
              </div>
              {mode === 'signup' && (
                <p className="text-[10px] text-zinc-600 mt-1">Minimum 6 characters.</p>
              )}
            </div>

            {mode === 'signup' && (
              <div>
                <label className={labelCls}>Confirm Password</label>
                <div className="relative">
                  <Icon n="lock" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" />
                  <input type={showPw ? 'text' : 'password'} value={confirm} onChange={e => setConfirm(e.target.value)}
                    placeholder="••••••••" autoComplete="new-password"
                    className={fieldCls + ' pl-9'} />
                </div>
              </div>
            )}

            <label className="flex items-center gap-2 cursor-pointer select-none pt-1">
              <input type="checkbox" checked={remember} onChange={e => setRemember(e.target.checked)}
                className="w-3.5 h-3.5 rounded border-white/20 bg-black/40 accent-gold" />
              <span className="text-[11px] text-zinc-500">Remember me for 30 days</span>
            </label>

            {error && (
              <div className="flex items-start gap-2 text-[12px] text-rose-300 bg-rose-500/10 border border-rose-500/30 rounded-xl px-3 py-2.5 pop-in">
                <Icon n="alert" size={14} className="mt-0.5 shrink-0" />
                <span>{error}</span>
              </div>
            )}

            <button type="submit" disabled={busy}
              className={`w-full flex items-center justify-center gap-2 py-3 rounded-xl text-[13px] font-bold transition active:scale-[.99]
                ${busy
                  ? 'bg-white/10 text-zinc-500 cursor-wait'
                  : 'text-black bg-gradient-to-r from-gold-soft to-gold hover:brightness-110 shadow-lg shadow-gold/25'}`}>
              {busy ? 'Please wait…' : (mode === 'login' ? 'Sign In' : 'Create Account')}
              {!busy && <Icon n={mode === 'login' ? 'arrow' : 'plus'} size={14} strokeWidth={2.5} />}
            </button>
          </form>

          <div className="text-center text-[12px] text-zinc-500 mt-5">
            {mode === 'login' ? "Don't have an account? " : "Already have an account? "}
            <button onClick={() => switchMode(mode === 'login' ? 'signup' : 'login')}
              className="font-semibold text-gold hover:text-gold-soft transition underline-offset-4 hover:underline">
              {mode === 'login' ? 'Sign up' : 'Sign in'}
            </button>
          </div>

          <p className="text-[10px] text-zinc-600 text-center mt-6 leading-relaxed">
            Local-only authentication. Your credentials never leave this browser.<br />
            <span className="am">ምስጢርዎ በአሳሽዎ ውስጥ ብቻ ይቀመጣል።</span>
          </p>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   TRACKER (main app, shown when authenticated)
   ============================================================ */
const TABS = [
  { id: 'dashboard', label: 'Dashboard', am: 'ዳሽቦርድ', icon: 'dash' },
  { id: 'journal', label: 'Journal', am: 'መዝገብ', icon: 'book' },
  { id: 'roadmap', label: 'Roadmap', am: 'ዕቅድ', icon: 'map' },
  { id: 'analytics', label: 'Analytics', am: 'ትንተና', icon: 'chart' }
];

function TrackerApp({ session, onLogout }) {
  const [data, setData] = useState(() => loadUserData(session.userId));
  const [tab, setTab] = useState('dashboard');
  const [modalOpen, setModalOpen] = useState(false);
  const [profileOpen, setProfileOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  useEffect(() => {
    saveUserData(session.userId, data);
  }, [data, session.userId]);

  useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [tab]);

  const showToast = (msg, type = 'success') => {
    setToast({ msg, type });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2600);
  };

  const today = todayISO();
  const dayNum = clamp(daysBetween(data.startDate, today) + 1, 1, 90);
  const stats = useMemo(() => computeStats(data.entries), [data.entries]);
  const lockedToday = data.lockDate === today;

  const discipline = useMemo(() => {
    const tr = data.entries.filter(e => e.direction !== 'No Trade' && typeof e.resultR === 'number');
    const compRate = tr.length ? tr.filter(e => e.compliant).length / tr.length : null;
    const days = clamp(dayNum, 1, 30);
    let doneDays = 0;
    for (let i = 0; i < days; i++) {
      const c = data.checklist[isoAgo(i)];
      if (c && c.filter(Boolean).length === 4) doneDays++;
    }
    const checkRate = doneDays / days;
    const score = compRate === null ? checkRate * 100 : (compRate * 0.6 + checkRate * 0.4) * 100;
    return Math.round(clamp(score, 0, 100));
  }, [data, dayNum]);

  const saveEntry = entry => {
    setData(d => ({ ...d, entries: [...d.entries, entry] }));
    setModalOpen(false);
    showToast('Trade logged successfully');
  };

  const deleteEntry = id => {
    if (!confirm('Delete this journal entry?')) return;
    setData(d => ({ ...d, entries: d.entries.filter(e => e.id !== id) }));
    showToast('Entry deleted', 'warn');
  };

  const emergencyStop = () => {
    if (lockedToday) return;
    if (!confirm('Engage Emergency Stop? This locks the journal for the rest of today.')) return;
    setData(d => ({ ...d, lockDate: today }));
    showToast('Emergency stop engaged — journal locked', 'error');
  };

  const unlock = () => {
    setData(d => ({ ...d, lockDate: null }));
    showToast('Journal unlocked');
  };

  const initial = (session.name || session.email || 'U').charAt(0).toUpperCase();

  return (
    <div className="min-h-screen pb-28 md:pb-10">
      <header className="sticky top-0 z-40 border-b border-white/[.06] bg-[#09090B]/80 backdrop-blur-xl">
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
          <div className="relative grid place-items-center h-9 w-9 rounded-xl bg-gradient-to-br from-gold-soft to-gold-deep shrink-0 shadow-lg shadow-gold/20">
            <span className="text-black font-extrabold text-[13px]">Au</span>
            <span className="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full bg-emerald-400 border-2 border-[#09090B]" />
          </div>
          <div className="min-w-0 flex-1">
            <h1 className="text-[13.5px] font-bold text-white leading-tight truncate">
              Dagi's 90-Day <span className="shimmer-text">Gold</span>
            </h1>
            <p className="text-[10px] text-zinc-500 leading-tight am truncate">የወርቅ ግብይት ስነ-ስርዓት መከታተያ</p>
          </div>

          <div className="hidden sm:flex items-center gap-3">
            <div className="text-right">
              <div className="text-[9px] uppercase tracking-widest text-zinc-500">Day</div>
              <div className="text-[13px] font-bold text-gold tabular-nums leading-tight">{dayNum}/90</div>
            </div>
            <div className="h-8 w-px bg-white/10" />
            <div className="text-right">
              <div className="text-[9px] uppercase tracking-widest text-zinc-500">Total R</div>
              <div className={`text-[13px] font-bold tabular-nums leading-tight ${stats.totalR >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                {fmtR(stats.totalR)}
              </div>
            </div>
          </div>

          <button onClick={() => setModalOpen(true)} disabled={lockedToday}
            className={`hidden md:inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-[12px] font-bold transition active:scale-95
              ${lockedToday ? 'bg-white/5 text-zinc-600 cursor-not-allowed' : 'text-black bg-gradient-to-r from-gold-soft to-gold hover:brightness-110 shadow-lg shadow-gold/25'}`}>
            <Icon n="plus" size={14} strokeWidth={3} /> New Entry
          </button>

          {/* Profile dropdown */}
          <div className="relative">
            <button onClick={() => setProfileOpen(v => !v)}
              className="grid place-items-center h-9 w-9 rounded-full bg-gradient-to-br from-gold-soft to-gold-deep text-black font-bold text-[13px] shadow-lg shadow-gold/20 hover:brightness-110 transition active:scale-95 ring-2 ring-[#09090B]"
              title={session.name || session.email}>
              {initial}
            </button>
            {profileOpen && (
              <>
                <div className="fixed inset-0 z-40" onClick={() => setProfileOpen(false)} />
                <div className="absolute right-0 top-11 z-50 w-60 glass rounded-xl border border-white/10 shadow-2xl overflow-hidden slide-up">
                  <div className="px-4 py-3 border-b border-white/[.06]">
                    <div className="text-[13px] font-semibold text-white truncate">{session.name || 'Trader'}</div>
                    <div className="text-[11px] text-zinc-500 truncate">{session.email}</div>
                  </div>
                  <button onClick={() => { setProfileOpen(false); onLogout(); }}
                    className="w-full flex items-center gap-2 px-4 py-2.5 text-[12px] font-medium text-zinc-300 hover:bg-white/5 transition">
                    <Icon n="logout" size={14} /> Sign Out
                  </button>
                </div>
              </>
            )}
          </div>
        </div>

        <div className="max-w-6xl mx-auto px-4 hidden md:block">
          <nav className="flex gap-1 -mb-px">
            {TABS.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`relative flex items-center gap-2 px-4 py-2.5 text-[12.5px] font-semibold transition-colors
                  ${tab === t.id ? 'text-gold' : 'text-zinc-500 hover:text-zinc-300'}`}>
                <Icon n={t.icon} size={15} />
                {t.label}
                {tab === t.id && (
                  <span className="absolute bottom-0 left-2 right-2 h-[2px] rounded-full bg-gradient-to-r from-gold-deep via-gold to-gold-soft" />
                )}
              </button>
            ))}
          </nav>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 py-5">
        {lockedToday && tab !== 'dashboard' && (
          <div className="mb-4 rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-2.5 text-[12px] text-rose-300 flex items-center justify-between gap-3">
            <span className="flex items-center gap-2"><Icon n="lock" size={14} /> Emergency stop active — journal locked today.</span>
            <button onClick={unlock} className="text-[11px] font-semibold text-rose-200 underline decoration-rose-400/50 underline-offset-2 hover:text-white">
              Unlock
            </button>
          </div>
        )}

        {tab === 'dashboard' && (
          <Dashboard
            data={data} setData={setData} stats={stats} dayNum={dayNum}
            discipline={discipline} onAdd={() => setModalOpen(true)}
            onEmergency={emergencyStop} lockedToday={lockedToday} />
        )}
        {tab === 'journal' && (
          <Journal data={data} setData={setData} lockedToday={lockedToday}
            onAdd={() => setModalOpen(true)} onDelete={deleteEntry} showToast={showToast} />
        )}
        {tab === 'roadmap' && <Roadmap data={data} setData={setData} dayNum={dayNum} />}
        {tab === 'analytics' && <Analytics data={data} setData={setData} stats={stats} showToast={showToast} />}

        <footer className="mt-10 text-center">
          <p className="text-[10px] text-zinc-700">
            Discipline over prediction. <span className="am">ተግሣጽ ከትንበያ ይበልጣል</span>
          </p>
          <p className="text-[9px] text-zinc-800 mt-1">Data stored locally in your browser · Export regularly</p>
        </footer>
      </main>

      <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 border-t border-white/[.07] bg-[#0B0B0E]/92 backdrop-blur-xl pb-[env(safe-area-inset-bottom)]">
        <div className="grid grid-cols-5">
          {TABS.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={`flex flex-col items-center gap-0.5 py-2.5 transition-colors active:scale-95
                ${tab === t.id ? 'text-gold' : 'text-zinc-600'}`}>
              <span className={`grid place-items-center h-7 w-7 rounded-lg transition-all ${tab === t.id ? 'bg-gold/15' : ''}`}>
                <Icon n={t.icon} size={17} />
              </span>
              <span className="text-[9px] font-semibold">{t.label}</span>
            </button>
          ))}
          <button onClick={() => setModalOpen(true)} disabled={lockedToday}
            className={`flex flex-col items-center gap-0.5 py-2.5 active:scale-95 ${lockedToday ? 'text-zinc-700' : 'text-gold'}`}>
            <span className={`grid place-items-center h-7 w-7 rounded-lg ${lockedToday ? 'bg-white/5' : 'bg-gradient-to-br from-gold-soft to-gold text-black shadow-lg shadow-gold/25'}`}>
              <Icon n={lockedToday ? 'lock' : 'plus'} size={17} strokeWidth={2.5} />
            </span>
            <span className="text-[9px] font-semibold">Add</span>
          </button>
        </div>
      </nav>

      <EntryModal open={modalOpen} onClose={() => setModalOpen(false)} onSave={saveEntry} />
      <Toast toast={toast} />
    </div>
  );
}

/* ============================================================
   ROOT
   ============================================================ */
function App() {
  const [session, setSession] = useState(loadSession);

  if (!session) {
    return <AuthScreen onAuth={setSession} />;
  }

  return (
    <TrackerApp
      key={session.userId}
      session={session}
      onLogout={() => { clearSession(); setSession(null); }}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
